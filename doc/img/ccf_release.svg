<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" fill="none" role="img" aria-labelledby="title desc">
<title id="title">CCF LTS support window</title>
<desc id="desc">Timeline of three consecutive major releases N, N+1 and N+2. Each major release is followed by patch releases and is supported for at least a year. The support window of a release overlaps with the next major release, leaving an upgrade window before its end of life.</desc>
