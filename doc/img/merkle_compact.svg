<svg xmlns="http://www.w3.org/2000/svg" width="919" height="546" viewBox="20 18 919 546" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Compacted Merkle tree</title>
<desc id="desc">After H6, the hash of the signature transaction at seqno 6, is inserted and consensus commits, the tree is compacted: H1 to H4, H12 and H34 are discarded, while H1234, H5, H6 and H56 are retained to issue receipts from seqno 6 onwards.</desc>
