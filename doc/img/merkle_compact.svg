<linearGradient id="hash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6CC2E8"/><stop offset=".55" stop-color="#4AA3D4"/><stop offset="1" stop-color="#3C8FC4"/></linearGradient>
<linearGradient id="root" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8D9BF5"/><stop offset=".5" stop-color="#5D6FE6"/><stop offset="1" stop-color="#3F4FB8"/></linearGradient>
</defs>
