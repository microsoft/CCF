[package]
name = "tee-attestation-verification-ffi"
version = "1.0.8"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/microsoft/TEE-Attestation-Verification"
keywords = ["confidentiality", "sev-snp", "tpm"]
description = "C and WebAssembly bindings for TEE attestation verification"
authors = ["Chris Jensen"]
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["crypto_openssl", "crypto_webcrypto", "crypto_windows"]
crypto_openssl = [
    "crypto/crypto_openssl",
    "attestation/crypto_openssl",
    "cose/crypto_openssl",
    "caci/crypto_openssl",
]
crypto_webcrypto = [
    "crypto/crypto_webcrypto",
    "attestation/crypto_webcrypto",
    "cose/crypto_webcrypto",
    "caci/crypto_webcrypto",
]
crypto_windows = [
    "crypto/crypto_windows",
    "attestation/crypto_windows",
    "cose/crypto_windows",
    "caci/crypto_windows",
]

[dependencies]
attestation = { package = "tee-attestation-verification-lib", version = "1.0.8", path = "../attestation", default-features = false }
caci = { package = "tee-attestation-verification-caci", version = "1.0.8", path = "../caci", default-features = false }
cbor = { package = "tee-attestation-verification-cbor", version = "1.0.8", path = "../cbor" }
cose = { package = "tee-attestation-verification-cose", version = "1.0.8", path = "../cose", default-features = false }
crypto = { package = "tee-attestation-verification-crypto", version = "1.0.8", path = "../crypto", default-features = false }
serde_json = ">=1, <2"
serde = ">=1, <2"
zerocopy = { version = ">=0.8, <0.9", features = ["derive"] }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = ">=0.3, <0.4"
wasm-bindgen = ">=0.2, <0.3"
wasm-bindgen-futures = ">=0.4, <0.5"
