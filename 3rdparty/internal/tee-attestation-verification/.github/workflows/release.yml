name: Release

on:
  push:
    tags:
      - "tav-*"

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare_release:
    name: Prepare release
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      commit_sha: ${{ steps.prepare.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate tag and version
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          candidate_tag="${GITHUB_REF_NAME}"

          if [[ ! "${candidate_tag}" =~ ^tav-.+$ ]]; then
            echo "Release tags must use the tav-<version> format, got: ${candidate_tag}" >&2
            exit 1
          fi

          commit_sha=$(git rev-parse "refs/tags/${candidate_tag}^{commit}")
          normalized_version="${candidate_tag#tav-}"

          package_version=$(
            python3 scripts/check-version-sync.py \
              --root-path "${GITHUB_WORKSPACE}" \
              --print-version
          )
          if [[ "${package_version}" != "${normalized_version}" ]]; then
            echo "Tag ${candidate_tag} does not match package version ${package_version}" >&2
            exit 1
          fi

          echo "tag=${candidate_tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${normalized_version}" >> "${GITHUB_OUTPUT}"
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"

  ci:
    name: Workspace CI
    needs: prepare_release
    uses: ./.github/workflows/ci.yml

  ci-attestation:
    name: Attestation CI
    needs: prepare_release
    uses: ./.github/workflows/ci-attestation.yml

  ci-caci:
    name: CACI attestation verification CI
    needs: prepare_release
    uses: ./.github/workflows/ci-caci.yml

  ci-cose:
    name: COSE CI
    needs: prepare_release
    uses: ./.github/workflows/ci-cose.yml

  ci-crypto:
    name: Crypto CI
    needs: prepare_release
    uses: ./.github/workflows/ci-crypto.yml

  ci-demo:
    name: Demo CI
    needs: prepare_release
    uses: ./.github/workflows/ci-demo.yml

  ci-ffi:
    name: FFI CI
    needs: prepare_release
    uses: ./.github/workflows/ci-ffi.yml

  package:
    name: Package release artifacts
    runs-on: ubuntu-22.04
    needs: prepare_release
    env:
      VERSION: ${{ needs.prepare_release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare_release.outputs.commit_sha }}

      - name: Install rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable

      - name: Setup WASM tooling
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --version 0.13.1 --locked

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "8.0.423"

      - name: Install OpenSSL build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libssl-dev pkg-config

      - name: Build tav-wasm bundle with WebCrypto crypto
        shell: bash
        working-directory: ffi
        run: |
          set -euo pipefail

          mkdir -p ../dist/tav-wasm ../release-artifacts

          wasm-pack build \
            --target web \
            --release \
            --out-dir ../dist/tav-wasm \
            --no-default-features \
            --features "crypto_webcrypto"

          tar -C ../dist -czf "../release-artifacts/tav-wasm-${VERSION}.tar.gz" tav-wasm

      - name: Build and pack .NET package and native library
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack \
            ffi/csharp/TeeAttestationVerification/TeeAttestationVerification.csproj \
            --configuration Release \
            -p:PackageVersion="${VERSION}" \
            --output release-artifacts

      - name: Capture build toolchain info
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Build toolchain used for TAV release artifacts"
            echo "version: ${VERSION}"
            echo "commit: ${{ needs.prepare_release.outputs.commit_sha }}"
            echo
            scripts/capture-build-info.sh rust wasm dotnet
          } > release-artifacts/BUILD-INFO.txt

          cat release-artifacts/BUILD-INFO.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release-artifacts/*

  create_release:
    name: Create release
    runs-on: ubuntu-22.04
    needs:
      - prepare_release
      - ci
      - ci-attestation
      - ci-caci
      - ci-cose
      - ci-crypto
      - ci-demo
      - ci-ffi
      - package
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare_release.outputs.commit_sha }}

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist

      - name: Generate release artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            find . -maxdepth 1 -type f -printf '%f\0' |
              sort -z |
              xargs -0 sha256sum > "${RUNNER_TEMP}/SHA256SUMS"
          )
          mv "${RUNNER_TEMP}/SHA256SUMS" dist/SHA256SUMS

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create --verify-tag --draft --generate-notes "${RELEASE_TAG}" dist/*
