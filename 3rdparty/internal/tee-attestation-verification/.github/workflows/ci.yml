name: "Workspace CI"

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  version-sync:
    name: Version sync
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # check-version-sync.py needs tomllib, which is only in the standard library
      # from Python 3.11. Ubuntu 22.04 ships 3.10, so request an explicit version.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "8.0.423"

      - name: Check package versions match changelog
        run: python3 scripts/check-version-sync.py --root-path "${{ github.workspace }}"

  license-headers:
    name: License headers
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check license headers
        run: scripts/check-license-headers.sh "${{ github.workspace }}"

  format:
    name: Format check
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rust
        run: |
          rustup update stable && rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

  docs-build:
    name: Docs build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rust
        run: |
          rustup update stable && rustup default stable

      - name: Setup WASM tooling
        run: rustup target add wasm32-unknown-unknown

      - name: Native build docs
        run: cargo doc -p tee-attestation-verification-lib

      - name: WASM build docs
        run: cargo doc -p tee-attestation-verification-lib --target wasm32-unknown-unknown
