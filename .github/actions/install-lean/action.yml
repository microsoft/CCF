name: Install Lean
description: Install elan and the Lean toolchain pinned by lean/lean-toolchain

runs:
  using: composite
  steps:
    - name: Install Lean
      shell: bash
      run: |
        set -euo pipefail
        curl --proto '=https' --tlsv1.2 -sSf \
          https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh \
          -o /tmp/elan-init.sh
        sh /tmp/elan-init.sh -y --default-toolchain none
        rm /tmp/elan-init.sh
        export PATH="${HOME}/.elan/bin:${PATH}"
        elan toolchain install "$(cat lean/lean-toolchain)"
        echo "${HOME}/.elan/bin" >> "$GITHUB_PATH"
