name: Install Lean
description: Install elan and the Lean toolchain pinned in lean/lean-toolchain

inputs:
  install-system-dependencies:
    description: Install the Azure Linux 4 packages needed to build Lean packages with dnf
    required: false
    default: "false"
  extra-packages:
    description: Space-separated additional dnf packages, installed with the system dependencies
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install system dependencies
      if: inputs.install-system-dependencies == 'true'
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        set -euo pipefail
        # elan-init.sh needs gawk; lake check needs which
        # shellcheck disable=SC2086
        dnf -y install \
          ca-certificates git curl tar zstd gzip gcc gcc-c++ make glibc-devel \
          gmp-devel diffutils findutils gawk which $EXTRA_PACKAGES

    - name: Install elan and Lean toolchain
      shell: bash
      env:
        # elan-init.sh only bootstraps elan: it always installs the latest elan release.
        # The Lean toolchain itself is pinned by lean/lean-toolchain.
        ELAN_INIT_URL: https://raw.githubusercontent.com/leanprover/elan/55dc2814ca42ace25f05ba4dd7a43a8c701a0549/elan-init.sh
      run: |
        set -euo pipefail
        elan_home="${ELAN_HOME:-$HOME/.elan}"
        elan_init="$(mktemp)"
        curl --proto '=https' --tlsv1.2 -sSf "$ELAN_INIT_URL" -o "$elan_init"
        ELAN_HOME="$elan_home" sh "$elan_init" -y --no-modify-path --default-toolchain none
        rm "$elan_init"
        echo "ELAN_HOME=$elan_home" >> "$GITHUB_ENV"
        echo "$elan_home/bin" >> "$GITHUB_PATH"
        export ELAN_HOME="$elan_home"
        "$elan_home/bin/elan" toolchain install "$(cat lean/lean-toolchain)"
        "$elan_home/bin/elan" run "$(cat lean/lean-toolchain)" lean --version
