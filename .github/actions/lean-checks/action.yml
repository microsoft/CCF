name: Check Lean package
description: Build a Lean package, run its build-time tests and linters, and check its formatting

inputs:
  working-directory:
    description: Lean package directory relative to the repository root
    required: true
  library:
    description: Lean library whose generated import root must be complete
    required: true
  executable-root:
    description: Root module of the package's executable, checked by the Mathlib linters
    required: true

runs:
  using: composite
  steps:
    - name: Restore Mathlib cache
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: lake exe cache get

    - name: Build and check Lean package
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        LEAN_LIBRARY: ${{ inputs.library }}
      run: |
        set -euo pipefail
        lake exe mk_all --check --module --lib "$LEAN_LIBRARY"
        lake build --wfail --fail-fast
        lake build CCF
        lake lint

    - name: Check Mathlib linters
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        LEAN_LIBRARY: ${{ inputs.library }}
        LEAN_EXECUTABLE_ROOT: ${{ inputs.executable-root }}
      run: |
        set -euo pipefail
        lake exe runLinter --no-build CCF "$LEAN_LIBRARY" "$LEAN_EXECUTABLE_ROOT"

    - name: Check Lean formatting
      shell: bash
      env:
        LEAN_PACKAGE: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        "$GITHUB_WORKSPACE/scripts/lean-format-checks.sh" "$LEAN_PACKAGE"
