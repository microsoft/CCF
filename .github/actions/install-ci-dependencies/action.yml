name: Install Azure Linux CI dependencies
description: Restore and populate the Azure Linux dependency caches

inputs:
  cache-python-packages:
    description: Restore and save uv's package cache
    required: false
    default: "true"
  python-cache-scope:
    description: Dependency workload stored in the uv cache
    required: false
    default: tests

runs:
  using: composite
  steps:
    - name: Configure RPM package cache
      id: configure
      shell: bash
      run: |
        set -euo pipefail

        source /etc/os-release
        case "$VERSION_ID" in
          3.0)
            package_manager=tdnf
            setup_script=scripts/setup-ci.sh
            cache_dir=/github/home/.ccf-package-cache/tdnf
            config_file=/etc/tdnf/tdnf.conf
            cache_option=cachedir
            keepcache_value=1
            ;;
          4.0)
            package_manager=dnf
            setup_script=scripts/setup-ci-al4.sh
            cache_dir=/github/home/.ccf-package-cache/dnf
            config_file=/etc/dnf/dnf.conf
            cache_option=system_cachedir
            keepcache_value=True
            ;;
          *)
            echo "Unsupported Azure Linux version: $VERSION_ID" >&2
            exit 1
            ;;
        esac

        for attempt in 1 2 3; do
          if "$package_manager" -y install tar zstd; then
            break
          fi
          if (( attempt == 3 )); then
            echo "Failed to install package cache tools" >&2
            exit 1
          fi
          if (( attempt == 1 )); then
            sleep 5
          else
            sleep 30
          fi
        done

        set_config_option() {
          local name=$1
          local value=$2

          if grep -q "^${name}=" "$config_file"; then
            sed -i "s|^${name}=.*|${name}=${value}|" "$config_file"
          else
            sed -i "/^\[main\]/a ${name}=${value}" "$config_file"
          fi
        }

        set_config_option "$cache_option" "$cache_dir"
        set_config_option keepcache "$keepcache_value"
        uv_cache_dir=/github/home/.ccf-package-cache/uv
        mkdir -p "$cache_dir" "$uv_cache_dir"

        day_of_week=$(date -u +%u)
        days_since_sunday=$((day_of_week % 7))
        cache_week=$(date -u -d "$days_since_sunday days ago" +%Y-%m-%d)

        echo "cache-dir=$cache_dir" >> "$GITHUB_OUTPUT"
        echo "cache-week=$cache_week" >> "$GITHUB_OUTPUT"
        echo "package-manager=$package_manager" >> "$GITHUB_OUTPUT"
        echo "setup-script=$setup_script" >> "$GITHUB_OUTPUT"
        echo "uv-cache-dir=$uv_cache_dir" >> "$GITHUB_OUTPUT"

        echo "UV_CACHE_DIR=$uv_cache_dir" >> "$GITHUB_ENV"

    - name: Restore RPM package cache
      continue-on-error: true
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.configure.outputs.cache-dir }}
        key: azure-linux-${{ steps.configure.outputs.package-manager }}-rpms-${{ runner.arch }}-${{ hashFiles('scripts/setup-ci*.sh') }}-${{ steps.configure.outputs.cache-week }}
        restore-keys: |
          azure-linux-${{ steps.configure.outputs.package-manager }}-rpms-${{ runner.arch }}-${{ hashFiles('scripts/setup-ci*.sh') }}-
          azure-linux-${{ steps.configure.outputs.package-manager }}-rpms-${{ runner.arch }}-

    # The PyPI proxy redirects downloads to short-lived URLs, which prevents
    # pip from reusing its cache across jobs. CI dependency installs use uv so
    # this cache remains content-addressed and reusable.
    - name: Restore Python package cache
      if: inputs.cache-python-packages == 'true'
      continue-on-error: true
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.configure.outputs.uv-cache-dir }}
        key: azure-linux-${{ steps.configure.outputs.package-manager }}-python-packages-${{ runner.arch }}-${{ inputs.python-cache-scope }}-${{ hashFiles('python/pyproject.toml', '**/*requirements*.txt', 'scripts/*checks.sh', 'scripts/setup-ci*.sh', 'scripts/install_uv.sh') }}-${{ steps.configure.outputs.cache-week }}
        restore-keys: |
          azure-linux-${{ steps.configure.outputs.package-manager }}-python-packages-${{ runner.arch }}-${{ inputs.python-cache-scope }}-${{ hashFiles('python/pyproject.toml', '**/*requirements*.txt', 'scripts/*checks.sh', 'scripts/setup-ci*.sh', 'scripts/install_uv.sh') }}-
          azure-linux-${{ steps.configure.outputs.package-manager }}-python-packages-${{ runner.arch }}-${{ inputs.python-cache-scope }}-
          azure-linux-${{ steps.configure.outputs.package-manager }}-python-packages-${{ runner.arch }}-
    - name: Restore npm package cache
      continue-on-error: true
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /github/home/.npm
        key: azure-linux-npm-packages-${{ runner.arch }}-${{ hashFiles('**/package.json', 'scripts/prettier-checks.sh') }}-${{ github.job }}-${{ steps.configure.outputs.cache-week }}
        restore-keys: |
          azure-linux-npm-packages-${{ runner.arch }}-${{ hashFiles('**/package.json', 'scripts/prettier-checks.sh') }}-${{ github.job }}-
          azure-linux-npm-packages-${{ runner.arch }}-${{ hashFiles('**/package.json', 'scripts/prettier-checks.sh') }}-
          azure-linux-npm-packages-${{ runner.arch }}-

    - name: Install dependencies
      shell: bash
      env:
        PACKAGE_MANAGER: ${{ steps.configure.outputs.package-manager }}
        SETUP_SCRIPT: ${{ steps.configure.outputs.setup-script }}
      run: |
        set -euo pipefail
        "$PACKAGE_MANAGER" clean metadata
        bash "$SETUP_SCRIPT"
