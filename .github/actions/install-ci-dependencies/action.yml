name: Install CI dependencies
description: Restore and populate the Azure Linux package cache

inputs:
  azure-linux-version:
    description: Azure Linux major version
    required: true

outputs:
  cache-hit:
    description: Whether an exact package cache was restored
    value: ${{ steps.package-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Configure package cache
      id: configure
      shell: bash
      env:
        AZURE_LINUX_VERSION: ${{ inputs.azure-linux-version }}
      run: |
        set -euo pipefail

        set_config_option() {
          local config_file=$1
          local name=$2
          local value=$3

          if grep -q "^${name}=" "$config_file"; then
            sed -i "s|^${name}=.*|${name}=${value}|" "$config_file"
          else
            sed -i "/^\[main\]/a ${name}=${value}" "$config_file"
          fi
        }

        retry_package_command() {
          local description=$1
          shift

          local attempt=1
          local delay
          while ! "$@"; do
            if (( attempt == 3 )); then
              echo "'$description' failed after 3 attempts" >&2
              return 1
            fi

            if (( attempt == 1 )); then
              delay=5
            else
              delay=30
            fi
            echo "'$description' failed on attempt $attempt. Retrying in ${delay}s..."
            sleep "$delay"
            attempt=$((attempt + 1))
          done
        }

        case "$AZURE_LINUX_VERSION" in
          3)
            manager=tdnf
            cache_dir=/github/home/.cache/tdnf
            config_file=/etc/tdnf/tdnf.conf
            setup_script=scripts/setup-ci.sh
            generation_file=.github/azure-linux-3-snapshot
            cache_generation=$(tr -d '\r\n' < "$generation_file")

            retry_package_command \
              "TDNF cache tools" \
              tdnf --snapshottime="$cache_generation" -y install tar zstd
            set_config_option "$config_file" cachedir "$cache_dir"
            set_config_option "$config_file" keepcache 1
            ;;
          4)
            manager=dnf
            cache_dir=/github/home/.cache/libdnf5
            config_file=/etc/dnf/dnf.conf
            setup_script=scripts/setup-ci-al4.sh
            generation_file=.github/azure-linux-4-cache-version
            cache_generation=$(tr -d '\r\n' < "$generation_file")

            retry_package_command "DNF cache tools" dnf -y install tar zstd
            set_config_option "$config_file" system_cachedir "$cache_dir"
            set_config_option "$config_file" keepcache True
            ;;
          *)
            echo "Unsupported Azure Linux version: $AZURE_LINUX_VERSION" >&2
            exit 1
            ;;
        esac

        mkdir -p "$cache_dir"
        grep -E '^(cachedir|system_cachedir|keepcache)=' "$config_file"

        base_fingerprint=$(
          {
            rpm -qa --qf '%{NAME}-%{EPOCHNUM}:%{VERSION}-%{RELEASE}.%{ARCH}\n' |
              LC_ALL=C sort
            sha256sum /etc/yum.repos.d/*.repo
          } |
            sha256sum |
            cut -d' ' -f1
        )
        dependency_fingerprint=$(
          sha256sum \
            "$setup_script" \
            "$generation_file" \
            .github/actions/install-ci-dependencies/action.yml |
            sha256sum |
            cut -d' ' -f1
        )
        key="azure-linux-rpms-v1-$manager-$RUNNER_ARCH-$cache_generation-$base_fingerprint-$dependency_fingerprint"

        echo "cache-dir=$cache_dir" >> "$GITHUB_OUTPUT"
        echo "cache-generation=$cache_generation" >> "$GITHUB_OUTPUT"
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "manager=$manager" >> "$GITHUB_OUTPUT"
        echo "setup-script=$setup_script" >> "$GITHUB_OUTPUT"

    - name: Restore package cache
      id: package-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.configure.outputs.cache-dir }}
        key: ${{ steps.configure.outputs.key }}

    - name: Install dependencies
      shell: bash
      env:
        CACHE_GENERATION: ${{ steps.configure.outputs.cache-generation }}
        CCF_PACKAGE_CACHE_DIR: ${{ steps.configure.outputs.cache-dir }}
        CCF_PACKAGE_CACHE_ONLY: ${{ steps.package-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        MANAGER: ${{ steps.configure.outputs.manager }}
        SETUP_SCRIPT: ${{ steps.configure.outputs.setup-script }}
      run: |
        set -euo pipefail
        if [[ "$MANAGER" == "tdnf" ]]; then
          export SOURCE_DATE_EPOCH="$CACHE_GENERATION"
        fi
        "$SETUP_SCRIPT"

    - name: Save package cache
      if: ${{ steps.package-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.configure.outputs.cache-dir }}
        key: ${{ steps.configure.outputs.key }}
