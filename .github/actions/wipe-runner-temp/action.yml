name: Wipe runner temp directory
description: >
  Delete files left in RUNNER_TEMP by earlier jobs on reused self-hosted runners.
  Run directly after actions/checkout, whose credentials file is kept.

runs:
  using: composite
  steps:
    - name: Wipe runner temp directory
      shell: bash
      run: |
        set -euo pipefail
        shopt -s dotglob nullglob
        : "${RUNNER_TEMP:?RUNNER_TEMP is not set}"
        [ "$RUNNER_TEMP" != / ]
        sudo=""
        if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null; then
          sudo=sudo
        fi
        if [ -L "$RUNNER_TEMP/_github_home" ]; then
          echo "Refusing to clean a symlinked _github_home" >&2
          exit 1
        fi
        for entry in "$RUNNER_TEMP"/* "$RUNNER_TEMP"/_github_home/*; do
          case "${entry#"$RUNNER_TEMP"/}" in
            _runner_file_commands | _github_workflow | _github_home | git-credentials-*.config) continue ;;
          esac
          $sudo rm -rf -- "$entry"
        done
