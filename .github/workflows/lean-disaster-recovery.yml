name: "Lean Disaster Recovery"

on:
  pull_request:
    paths:
      - "lean/disaster-recovery/**"
      - ".github/workflows/lean-disaster-recovery.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  canonical-model:
    name: Canonical model and proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y elan
          elan toolchain install "$(cat lean/disaster-recovery/lean-toolchain)"

      - name: Restore Mathlib cache
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Build and check canonical model
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          lake build
          lake env lean -DwarningAsError=true AxiomChecks.lean
          lake exe canonical-checks
