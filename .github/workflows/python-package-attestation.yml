name: Python Package Release Attestation
run-name: Attest Python package for ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: python-package-attestation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  attest-python-package:
    if: github.repository == 'microsoft/CCF'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download and verify the published wheel
        id: wheel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/ccf-* ]]; then
            echo "Attestation must run from a ccf-* release tag" >&2
            exit 1
          fi
          wheel_path=$(python3 scripts/prepare_python_package_attestation.py \
            "$GITHUB_REF_NAME")
          echo "path=$wheel_path" >> "$GITHUB_OUTPUT"

      - name: Attest the Python wheel
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.wheel.outputs.path }}

      - name: Upload the Python attestation bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" python-package.attestation.sigstore.json
          gh release upload --repo microsoft/CCF "$GITHUB_REF_NAME" \
            python-package.attestation.sigstore.json --clobber
