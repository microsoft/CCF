name: Python Package Release Attestation
run-name: Attest ccf ${{ inputs.package_version }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "CCF release tag used by OneBranch"
        type: string
        required: true
      package_version:
        description: "Python package version built by OneBranch"
        type: string
        required: true
      wheel_sha256:
        description: "SHA-256 digest of the wheel built by OneBranch"
        type: string
        required: true
      source_commit:
        description: "Source commit built by OneBranch"
        type: string
        required: true
      pipeline_run_url:
        description: "OneBranch pipeline run that published the wheel"
        type: string
        required: true

permissions: read-all

concurrency:
  group: python-package-attestation-${{ inputs.package_version }}
  cancel-in-progress: false

jobs:
  attest-python-package:
    if: github.repository == 'microsoft/CCF'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download and verify the published wheel
        id: wheel
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" || "$GITHUB_SHA" != "$SOURCE_COMMIT" ]]; then
            echo "Attestation must run from the release tag and OneBranch source commit" >&2
            exit 1
          fi
          wheel_path=$(python3 scripts/prepare_python_package_attestation.py \
            "$RELEASE_TAG" "$PACKAGE_VERSION" "$WHEEL_SHA256" "$SOURCE_COMMIT")
          echo "path=$wheel_path" >> "$GITHUB_OUTPUT"

      - name: Attest the Python wheel
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.wheel.outputs.path }}

      - name: Upload the Python attestation bundle
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" python-package.attestation.sigstore.json
          gh release upload --repo microsoft/CCF "$RELEASE_TAG" \
            python-package.attestation.sigstore.json --clobber

      - name: Link the publishing pipeline
        shell: bash
        env:
          PIPELINE_RUN_URL: ${{ inputs.pipeline_run_url }}
        run: |
          set -euo pipefail
          printf 'Publishing pipeline: %s\n' "$PIPELINE_RUN_URL" >> "$GITHUB_STEP_SUMMARY"
