name: "RPC performance diagnostic"
run-name: "RPC #8117 diagnostic (${{ github.sha }})"

on:
  workflow_dispatch:

permissions: read-all

jobs:
  rpc_performance:
    name: Isolated Basic Blocking comparison
    timeout-minutes: 90
    runs-on:
      [
        self-hosted,
        1ES.Pool=gha-vmss-d16av6-ci,
        "JobId=rpc_perf_ci-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}",
      ]
    container:
      image: mcr.microsoft.com/azurelinux/base/core:3.0
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      CCF_RPC_DIAGNOSTIC_ARTIFACTS: ${{ github.workspace }}/rpc-performance-artifacts
    steps:
      - name: Define diagnostic scratch directory
        run: |
          set -euo pipefail
          echo "CCF_RPC_DIAGNOSTIC_ROOT=$RUNNER_TEMP/ccf-rpc-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Set up container dependencies
        run: |
          set -euo pipefail
          gpg --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
          tdnf -y update
          tdnf -y install ca-certificates git gh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false

      - name: Install dependencies
        uses: ./.github/actions/install-ci-dependencies

      - name: Confirm benchmark platform
        run: python3 tests/infra/platform_detection.py virtual

      - name: Build all six Basic variants and shared client environment
        run: python3 -u scripts/rpc_performance_ci/build.py

      - name: Measure sequentially on the same VM
        run: |
          set -euo pipefail
          "$CCF_RPC_DIAGNOSTIC_ROOT/sources/base/build/env/bin/python" \
            -u scripts/rpc_performance_ci/run.py

      - name: Collect allowlisted evidence and operational summary
        if: always()
        run: python3 scripts/rpc_performance_ci/report.py

      - name: Upload diagnostic data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpc-performance-ci-data
          path: rpc-performance-artifacts/data
          retention-days: 7
          if-no-files-found: error

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpc-performance-ci-logs
          path: rpc-performance-artifacts/logs
          retention-days: 7
          if-no-files-found: error
