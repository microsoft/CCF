name: "RPC performance diagnostic"
run-name: "RPC #8117 diagnostic (${{ github.sha }})"

on:
  workflow_dispatch:

permissions: read-all

jobs:
  rpc_performance:
    name: Isolated Basic Blocking comparison
    timeout-minutes: 90
    runs-on:
      [
        self-hosted,
        1ES.Pool=gha-vmss-d16av6-ci,
        "JobId=rpc_perf_ci-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}",
      ]
    container:
      image: mcr.microsoft.com/azurelinux/base/core:3.0
      options: --user root
    defaults:
      run:
        shell: bash
    steps:
      - name: Define diagnostic container paths
        id: paths
        run: |
          set -euo pipefail
          {
            printf 'CCF_RPC_DIAGNOSTIC_ROOT=%s/ccf-rpc-%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'CCF_RPC_DIAGNOSTIC_ARTIFACTS=%s/rpc-performance-artifacts\n' "$(pwd -P)"
          } >> "$GITHUB_ENV"

      - name: Set up container dependencies
        run: |
          set -euo pipefail
          gpg --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
          tdnf -y update
          tdnf -y install ca-certificates git gh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: true

      - name: Install dependencies
        uses: ./.github/actions/install-ci-dependencies

      - name: Confirm benchmark platform
        run: python3 tests/infra/platform_detection.py virtual

      - name: Build all six Basic variants and shared client environment
        run: python3 -u scripts/rpc_performance_ci/build.py

      - name: Measure sequentially on the same VM
        run: |
          set -euo pipefail
          "$CCF_RPC_DIAGNOSTIC_ROOT/sources/base/build/env/bin/python" \
            -u scripts/rpc_performance_ci/run.py

      - name: Collect allowlisted evidence and operational summary
        id: collect
        if: always() && steps.checkout.outcome == 'success'
        run: python3 scripts/rpc_performance_ci/report.py

      - name: Report unavailable checkout
        id: checkout_failure
        if: always() && steps.checkout.outcome != 'success'
        run: |
          set -euo pipefail
          printf '%s\n' \
            '## RPC #8117 isolated diagnostic' \
            '**Operational success: no.** Source checkout is unavailable.' \
            'No diagnostic build or measurements ran. Collection and uploads were skipped.' \
            'See the preceding failed step for the primary failure.' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic data
        if: always() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpc-performance-ci-data
          path: ${{ env.CCF_RPC_DIAGNOSTIC_ARTIFACTS }}/data
          retention-days: 7
          if-no-files-found: error

      - name: Upload diagnostic logs
        if: always() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpc-performance-ci-logs
          path: ${{ env.CCF_RPC_DIAGNOSTIC_ARTIFACTS }}/logs
          retention-days: 7
          if-no-files-found: error
