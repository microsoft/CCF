name: Continuous Integration AL4

on:
  schedule:
    - cron: "0 0 * * 1-5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(github.ref, 'main')}}

permissions: read-all

jobs:
  vmss-virtual-a:
    name: "AL4 VMSS Virtual A" # Debug build, unit tests, e2e (bucket_a)
    runs-on: [gha-vmss-d16av7-ci]
    container:
      image: azlpubstagingacroxz2o4gw.azurecr.io/azurelinux/base/core:4.0
      options: --user root --publish-all --cap-add NET_ADMIN --cap-add NET_RAW --cap-add SYS_PTRACE --sysctl net.ipv6.conf.all.disable_ipv6=0 --sysctl net.ipv6.conf.default.disable_ipv6=0 --sysctl net.ipv6.conf.lo.disable_ipv6=0

    steps:
      - name: Wipe runner temp directory
        shell: bash
        run: &wipe_runner_temp |
          # Self-hosted VMSS runners are reused. Root-owned files left by earlier
          # --user root container jobs survive the runner's own temp cleanup.
          set -euo pipefail
          shopt -s dotglob nullglob
          : "${RUNNER_TEMP:?RUNNER_TEMP is not set}"
          [ "$RUNNER_TEMP" != / ]
          sudo=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null; then
            sudo=sudo
          fi
          for entry in "$RUNNER_TEMP"/* "$RUNNER_TEMP"/_github_home/*; do
            case "$entry" in
              "$RUNNER_TEMP"/_runner_file_commands | "$RUNNER_TEMP"/_github_workflow | "$RUNNER_TEMP"/_github_home) continue ;;
            esac
            $sudo rm -rf -- "$entry"
          done

      - name: "Checkout dependencies"
        shell: bash
        run: |
          set -ex
          dnf -y update
          dnf -y install ca-certificates git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "Install dependencies"
        uses: ./.github/actions/install-ci-dependencies

      - name: "Build Debug"
        run: |
          set -ex
          git config --global --add safe.directory /__w/CCF/CCF
          mkdir build
          cd build
          cmake -GNinja -DCMAKE_BUILD_TYPE=Debug -DTEST_MLDSA=ON ..
          grep -Fx "CCF_STACKTRACE_BACKEND_RESOLVED:INTERNAL=STD" CMakeCache.txt
          ninja
        shell: bash

      - name: "Run Unit tests"
        run: |
          set -ex
          cd build
          ./tests.sh --output-on-failure -L unit -j$(nproc --all)
        shell: bash

      - name: "Run e2e tests (bucket_a)"
        run: |
          set -ex
          cd build
          ./tests.sh --timeout 360 --output-on-failure -L bucket_a -LE lts_compatibility
        shell: bash

      - name: "Upload logs for AL4 virtual A"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-al4-virtual-a
          path: |
            build/workspace/*/*.config.json
            build/workspace/*/out
            build/workspace/*/err
            build/workspace/*/*.ledger/*
            build/workspace/*/*.ledger.*/*
            build/workspace/*/stack_trace
            build/workspace/**/openapi_coverage.json
          if-no-files-found: ignore
        if: success() || failure()

  vmss-virtual-b:
    name: "AL4 VMSS Virtual B" # End-to-end tests (bucket_b)
    runs-on: [gha-vmss-d16av7-ci-b]
    container:
      image: azlpubstagingacroxz2o4gw.azurecr.io/azurelinux/base/core:4.0
      options: --user root --publish-all --cap-add NET_ADMIN --cap-add NET_RAW --cap-add SYS_PTRACE --sysctl net.ipv6.conf.all.disable_ipv6=0 --sysctl net.ipv6.conf.default.disable_ipv6=0 --sysctl net.ipv6.conf.lo.disable_ipv6=0

    steps:
      - name: Wipe runner temp directory
        shell: bash
        run: *wipe_runner_temp

      - name: "Checkout dependencies"
        shell: bash
        run: |
          set -ex
          dnf -y update
          dnf -y install ca-certificates git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "cpuinfo"
        run: |
          cat /proc/cpuinfo
        shell: bash

      - name: "Install dependencies"
        uses: ./.github/actions/install-ci-dependencies

      - name: "Confirm running on Virtual"
        run: |
          set -ex
          python3 tests/infra/platform_detection.py virtual
        shell: bash

      - name: "Build Debug"
        run: |
          set -ex
          git config --global --add safe.directory /__w/CCF/CCF
          mkdir build
          cd build
          cmake -GNinja -DCMAKE_BUILD_TYPE=Debug ..
          grep -Fx "CCF_STACKTRACE_BACKEND_RESOLVED:INTERNAL=STD" CMakeCache.txt
          ninja
        shell: bash

      - name: "Run e2e tests (bucket_b)"
        run: |
          set -ex
          cd build
          rm -rf /github/home/.cache
          mkdir -p /github/home/.cache

          ./tests.sh --timeout 360 --output-on-failure -L bucket_b
        shell: bash

      - name: "Upload logs for AL4 virtual B"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-al4-virtual-b
          path: |
            build/workspace/*/*.config.json
            build/workspace/*/out
            build/workspace/*/err
            build/workspace/*/*.ledger/*
            build/workspace/*/*.ledger.*/*
            build/workspace/*/stack_trace
            build/workspace/**/openapi_coverage.json
          if-no-files-found: ignore
        if: success() || failure()

  vmss-virtual-c:
    name: "AL4 VMSS Virtual C" # End-to-end tests (bucket_c)
    runs-on: [gha-vmss-d16av7-ci-c]
    container:
      image: azlpubstagingacroxz2o4gw.azurecr.io/azurelinux/base/core:4.0
      options: --user root --publish-all --cap-add NET_ADMIN --cap-add NET_RAW --cap-add SYS_PTRACE --sysctl net.ipv6.conf.all.disable_ipv6=0 --sysctl net.ipv6.conf.default.disable_ipv6=0 --sysctl net.ipv6.conf.lo.disable_ipv6=0

    steps:
      - name: Wipe runner temp directory
        shell: bash
        run: *wipe_runner_temp

      - name: "Checkout dependencies"
        shell: bash
        run: |
          set -ex
          dnf -y update
          dnf -y install ca-certificates git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "Install dependencies"
        uses: ./.github/actions/install-ci-dependencies

      - name: "Build Debug"
        run: |
          set -ex
          git config --global --add safe.directory /__w/CCF/CCF
          mkdir build
          cd build
          cmake -GNinja -DCMAKE_BUILD_TYPE=Debug ..
          grep -Fx "CCF_STACKTRACE_BACKEND_RESOLVED:INTERNAL=STD" CMakeCache.txt
          ninja
        shell: bash

      - name: "Run e2e tests (bucket_c)"
        run: |
          set -ex
          cd build
          rm -rf /github/home/.cache
          mkdir -p /github/home/.cache

          ./tests.sh --timeout 360 --output-on-failure -L bucket_c
        shell: bash

      - name: "Upload logs for AL4 virtual C"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-al4-virtual-c
          path: |
            build/workspace/*/*.config.json
            build/workspace/*/out
            build/workspace/*/err
            build/workspace/*/*.ledger/*
            build/workspace/*/*.ledger.*/*
            build/workspace/*/stack_trace
            build/workspace/**/openapi_coverage.json
          if-no-files-found: ignore
        if: success() || failure()
