name: "Lean"

on:
  pull_request:
    paths:
      - "lean/**"
      - "**/*.lean"
      - "scripts/lean-format-checks.sh"
      - ".github/workflows/lean.yml"
      - "src/rust/**"
      - "src/crypto/sharing_ffi.h"
      - "scripts/extract-shamir.sh"
      - "scripts/check-shamir.sh"
      - "scripts/generate-shamir-header.sh"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  shamir-extraction:
    name: Reproduce Rust Shamir extraction and C header
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract the production Rust core
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/shamir-tools
          gh release download nightly-2026.10.20-fc321a2 \
            --repo AeneasVerif/aeneas --pattern aeneas-linux-x86_64.tar.gz \
            --dir build/shamir-tools
          echo '4b444e72e1e0bc475e952821bc081eb15665c984fd8032636c0346e766675794  build/shamir-tools/aeneas-linux-x86_64.tar.gz' | sha256sum --check
          tar -xzf build/shamir-tools/aeneas-linux-x86_64.tar.gz -C build/shamir-tools
          rustup toolchain install nightly-2026-09-17 --profile minimal \
            --component rustc-dev,rust-src,llvm-tools
          AENEAS_BIN="$PWD/build/shamir-tools/aeneas" \
            CHARON_BIN="$PWD/build/shamir-tools/charon" \
            bash scripts/extract-shamir.sh
          git diff --exit-code -- lean/shamir/Generated/CcfShamir.lean
          cargo +nightly-2026-09-17 test \
            --manifest-path src/rust/shamir/Cargo.toml --locked -j1
      - name: Check the generated C header
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_uv.sh "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          cargo +nightly-2026-09-17 install cbindgen --version 0.29.4 --locked
          RUSTUP_TOOLCHAIN=nightly-2026-09-17 \
            bash scripts/generate-shamir-header.sh --check

  models:
    name: Lean models and proofs
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lean and check prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y elan python3-jsonschema
          elan toolchain install "$(cat lean/lean-toolchain)"

      - name: Restore Mathlib caches
        shell: bash
        run: |
          set -euo pipefail
          for config in lean/*/lakefile.toml; do
            grep -q '^name = "mathlib"$' "$config" || continue
            package="$(dirname "$config")"
            echo "::group::Mathlib cache: $package"
            (
              cd "$package"
              if [ "$package" == "lean/shamir" ]; then
                export LEAN_NUM_THREADS=1
              fi
              lake exe cache get
            )
            echo "::endgroup::"
          done

      - name: Lint packages
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/lean-format-checks.sh
          for config in lean/*/lakefile.toml; do
            package="$(dirname "$config")"
            echo "::group::Lint: $package"
            (
              cd "$package"
              if [ "$package" == "lean/shamir" ]; then
                export LEAN_NUM_THREADS=1
              fi
              lake lint
            )
            echo "::endgroup::"
          done

      - name: Check packages
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          for config in lean/*/lakefile.toml; do
            package="$(dirname "$config")"
            echo "::group::Check: $package"
            (
              cd "$package"
              if [ "$package" == "lean/shamir" ]; then
                export LEAN_NUM_THREADS=1
              fi
              if grep -q '^name = "mathlib"$' lakefile.toml; then
                lake exe mk_all --check --module
              fi
              lake build --wfail --fail-fast
              if [ "$package" == "lean/shamir" ]; then
                bash ../../scripts/check-shamir.sh --inadvisably-no-sandbox
              else
                lake check --inadvisably-no-sandbox
              fi
            )
            echo "::endgroup::"
          done

      - name: Check recovery trace fixtures against their schema
        shell: bash
        run: |
          set -euo pipefail
          python3 lean/disaster-recovery/replayer/check-schema.py \
            lean/disaster-recovery/replayer/fixtures/*/*.out

      - name: Check disaster recovery replay
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          ./replayer/check-fixtures.sh

      - name: Dump replays for the trace viewer
        shell: bash
        run: python3 lean/disaster-recovery/replayer/viewer/build.py
