name: "Lean"

on:
  pull_request:
    paths:
      - "lean/**"
      - "**/*.lean"
      - "scripts/lean-format-checks.sh"
      - "tests/cft_trace*.py"
      - "tests/cft_scenarios*.py"
      - "tests/cft_scenarios/**"
      - "src/consensus/aft/**"
      - "src/kv/**"
      - "include/ccf/kv/**"
      - "include/ccf/tx.h"
      - "tests/kv_trace_validation*.py"
      - "tests/consistency_trace_validation.py"
      - "tests/tvc.py"
      - "samples/apps/basic_tv/**"
      - "CMakeLists.txt"
      - ".github/workflows/lean.yml"
      - ".github/workflows/lean-package.yml"
      # Checked by lean-mathlib-equivalence.yml.
      - "!lean/mathlib-equivalence/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  cft_traces:
    name: CCF consensus scenario captures
    runs-on: [gha-vmss-d16av7-ci-c]
    container:
      image: mcr.microsoft.com/azurelinux/base/core:3.0
      options: --user root
    defaults:
      run:
        shell: bash
    timeout-minutes: 60

    steps:
      - name: Checkout dependencies
        run: |
          set -euo pipefail
          gpg --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
          tdnf -y update
          tdnf -y install ca-certificates git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build dependencies
        uses: ./.github/actions/install-ci-dependencies
        with:
          cache-python-packages: "false"

      - name: Generate scenario captures
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B "$RUNNER_TEMP/cft-build" -GNinja -DCMAKE_BUILD_TYPE=Debug -DVERBOSE_LOGGING=ON
          cmake --build "$RUNNER_TEMP/cft-build" --target cft_driver --parallel "$(( ($(nproc) + 1) >> 1 ))"
          # RUNNER_TEMP can persist between jobs on reused self-hosted runners; drop files from earlier runs.
          rm -rf "$RUNNER_TEMP/cft-build/consensus/raw"
          uv run --no-project --with msgpack \
            ctest --test-dir "$RUNNER_TEMP/cft-build" -VV -R "^cft_scenario_test$" --no-tests=error

      - name: Upload CCF consensus traces
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cft-scenario-traces
          path: ${{ runner.temp }}/cft-build/consensus/raw/*.ndjson
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  kv_traces:
    name: KV trace captures
    runs-on: [gha-vmss-d16av7-ci-c]
    container:
      image: mcr.microsoft.com/azurelinux/base/core:3.0
      options: --user root
    defaults:
      run:
        shell: bash
    timeout-minutes: 60

    steps:
      - name: Checkout dependencies
        run: |
          set -euo pipefail
          gpg --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
          tdnf -y update
          tdnf -y install ca-certificates git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build dependencies
        uses: ./.github/actions/install-ci-dependencies
        with:
          cache-python-packages: "false"

      - name: Build and run instrumented KV unit tests
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B "$RUNNER_TEMP/ccf-kv-build" -GNinja \
            -DCMAKE_BUILD_TYPE=Debug -DCCF_KV_TRACING=ON
          cmake --build "$RUNNER_TEMP/ccf-kv-build" --target kv_test --parallel "$(( ($(nproc) + 1) >> 1 ))"
          ctest --test-dir "$RUNNER_TEMP/ccf-kv-build" -VV -R "^kv_test$" --no-tests=error

      - name: Generate KV captures
        run: |
          set -euo pipefail
          python3 tests/kv_trace_validation_test.py
          # RUNNER_TEMP can persist between jobs on reused self-hosted runners; drop files from earlier runs.
          rm -rf "$RUNNER_TEMP/ccf-kv-build/kv-traces"
          python3 tests/kv_trace_validation.py \
            --binary "$RUNNER_TEMP/ccf-kv-build/kv_test" --capture-only \
            --output "$RUNNER_TEMP/ccf-kv-build/kv-traces" --seeds 8 --timeout 900

      - name: Upload KV traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kv-traces
          path: ${{ runner.temp }}/ccf-kv-build/kv-traces/*/trace.ndjson
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Upload KV diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kv-trace-diagnostics
          path: |
            ${{ runner.temp }}/ccf-kv-build/kv-traces/
            ${{ runner.temp }}/ccf-kv-build/Testing/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  consistency_traces:
    name: Consistency trace captures
    runs-on: [gha-vmss-d16av7-ci-c]
    container:
      image: mcr.microsoft.com/azurelinux/base/core:3.0
      options: --user root
    defaults:
      run:
        shell: bash
    timeout-minutes: 60

    steps:
      - name: Checkout dependencies
        run: |
          set -euo pipefail
          gpg --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
          tdnf -y update
          tdnf -y install ca-certificates git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build dependencies
        uses: ./.github/actions/install-ci-dependencies

      - name: Build and capture consistency trace
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Debug -DLONG_TESTS=ON
          cmake --build build --target consistency_trace_validation --parallel "$(( ($(nproc) + 1) >> 1 ))"
          cd build
          ./tests.sh -VV -R "^consistency_trace_validation$" --no-tests=error

      - name: Upload consistency trace
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consistency-traces
          path: build/consistency/trace.ndjson
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Upload consistency diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consistency-trace-diagnostics
          path: |
            build/consistency/
            build/Testing/
            build/workspace/
          if-no-files-found: warn
          retention-days: 1
          overwrite: true

  packages:
    name: Lean package (${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        package: [consensus, common, consistency, disaster-recovery, kv]
    uses: ./.github/workflows/lean-package.yml
    with:
      package: ${{ matrix.package }}

  cft_replay:
    name: Replay native CCF consensus traces
    needs: [cft_traces]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Install prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y elan

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lean
        run: |
          set -euo pipefail
          elan run --install "$(cat lean/lean-toolchain)" lean --version

      - name: Build CCF consensus replay
        working-directory: lean/consensus
        run: |
          set -euo pipefail
          lake build --wfail consensus-replay

      # RUNNER_TEMP can persist between jobs on reused self-hosted runners; drop files from earlier runs.
      - name: Clear stale CCF consensus traces
        run: rm -rf "$RUNNER_TEMP/cft-scenario-traces"

      - name: Download CCF consensus traces
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cft-scenario-traces
          path: ${{ runner.temp }}/cft-scenario-traces

      - name: Validate CCF consensus traces
        shell: bash
        run: |
          set -euo pipefail
          shopt -s failglob
          for trace in "$RUNNER_TEMP"/cft-scenario-traces/*.ndjson; do
            echo "::group::Validate $trace"
            lean/consensus/.lake/build/bin/consensus-replay "$trace"
            echo "::endgroup::"
          done

  models:
    name: Lean models and proofs
    needs:
      [
        packages,
        cft_traces,
        cft_replay,
        kv_traces,
        kv_replay,
        consistency_traces,
        consistency_replay,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Require every Lean check to succeed
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          expected = {
              "packages",
              "cft_traces",
              "cft_replay",
              "kv_traces",
              "kv_replay",
              "consistency_traces",
              "consistency_replay",
          }
          needs = json.loads(os.environ["NEEDS"])
          print(json.dumps(needs, indent=2))
          if set(needs) != expected or any(job["result"] != "success" for job in needs.values()):
              raise SystemExit("::error::Every required Lean job must conclude success")
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify scheduled package inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib

          expected = {"consensus", "common", "consistency", "disaster-recovery", "kv"}
          # Checked by lean-mathlib-equivalence.yml.
          separate = {"mathlib-equivalence"}
          actual = {config.parent.name for config in pathlib.Path("lean").glob("*/lakefile.toml")} - separate
          if actual != expected:
              raise SystemExit(
                  f"::error::Lean package inventory changed: expected {sorted(expected)}, got {sorted(actual)}; "
                  "update scheduling, package validation, and formatting ownership"
              )
          PY

  kv_replay:
    name: Replay KV traces
    needs: [kv_traces]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Install prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y elan

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lean
        run: |
          set -euo pipefail
          elan run --install "$(cat lean/lean-toolchain)" lean --version

      - name: Build KV replay
        working-directory: lean/kv
        run: |
          set -euo pipefail
          lake build --wfail kv-replay

      # RUNNER_TEMP can persist between jobs on reused self-hosted runners; drop files from earlier runs.
      - name: Clear stale KV traces
        run: rm -rf "$RUNNER_TEMP/kv-traces"

      - name: Download KV traces
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kv-traces
          path: ${{ runner.temp }}/kv-traces

      - name: Validate KV traces
        run: |
          set -euo pipefail
          shopt -s failglob
          for trace in "$RUNNER_TEMP"/kv-traces/*/trace.ndjson; do
            echo "::group::Validate $trace"
            lean/kv/.lake/build/bin/kv-replay "$trace"
            echo "::endgroup::"
          done

  consistency_replay:
    name: Replay consistency traces
    needs: [consistency_traces]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Install prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y elan

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lean
        run: |
          set -euo pipefail
          elan run --install "$(cat lean/lean-toolchain)" lean --version

      - name: Build consistency replay
        working-directory: lean/consistency
        run: |
          set -euo pipefail
          lake build --wfail consistency-replay

      # RUNNER_TEMP can persist between jobs on reused self-hosted runners; drop files from earlier runs.
      - name: Clear stale consistency traces
        run: rm -rf "$RUNNER_TEMP/consistency-traces"

      - name: Download consistency traces
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: consistency-traces
          path: ${{ runner.temp }}/consistency-traces

      - name: Validate consistency traces and election fixtures
        run: |
          set -euo pipefail
          shopt -s failglob
          for trace in "$RUNNER_TEMP"/consistency-traces/*.ndjson lean/consistency/replayer/fixtures/valid/*.ndjson; do
            echo "::group::Validate $trace"
            lean/consistency/.lake/build/bin/consistency-replay "$trace"
            echo "::endgroup::"
          done
