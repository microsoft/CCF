name: "Lean"

on:
  pull_request:
    paths:
      - "lean/**"
      - "**/*.lean"
      - "scripts/lean-format-checks.sh"
      - "tests/raft_trace*.py"
      - "tests/raft_scenarios*.py"
      - "tests/raft_scenarios/**"
      - "src/consensus/aft/**"
      - "src/kv/**"
      - "include/ccf/kv/**"
      - "include/ccf/tx.h"
      - "tests/kv_trace_validation*.py"
      - ".github/workflows/lean.yml"
      - ".github/workflows/lean-package.yml"
  workflow_dispatch:
    inputs:
      standalone-replayers:
        description: Measure standalone replay builds instead of running checks
        type: boolean
        default: false
      restore-replay-caches:
        description: Restore Mathlib caches before standalone replay builds
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  standalone_replayers:
    name: Standalone replay (${{ matrix.package }}, cache=${{ inputs.restore-replay-caches }})
    if: github.event_name == 'workflow_dispatch' && inputs.standalone-replayers
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ccf-raft
            target: ccfraft-replay
          - package: kv
            target: kv-replay
    defaults:
      run:
        shell: bash
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
      PACKAGE: ${{ matrix.package }}
      TARGET: ${{ matrix.target }}
      RESTORE_CACHES: ${{ inputs.restore-replay-caches }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lean
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y elan time
          elan toolchain install "$(cat lean/lean-toolchain)"
          {
            printf 'Source: %s\n' "$(git rev-parse HEAD)"
            printf 'Runner: %s %s\n' "${ImageOS:?}" "${ImageVersion:?}"
            cat lean/lean-toolchain
            nproc
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore Mathlib cache
        if: inputs.restore-replay-caches
        working-directory: lean/${{ matrix.package }}
        run: |
          set -euo pipefail
          test ! -e .lake
          test ! -e ../common/.lake
          /usr/bin/time -o "$RUNNER_TEMP/cache-timing.txt" \
            -f 'elapsed_seconds=%e user_seconds=%U system_seconds=%S max_rss_kb=%M exit_status=%x' \
            lake exe cache get

      - name: Build standalone replay
        working-directory: lean/${{ matrix.package }}
        run: |
          set -euo pipefail
          if [ "$RESTORE_CACHES" != "true" ]; then
            test ! -e .lake
            test ! -e ../common/.lake
          fi
          /usr/bin/time -o "$RUNNER_TEMP/replay-timing.txt" \
            -f 'elapsed_seconds=%e user_seconds=%U system_seconds=%S max_rss_kb=%M exit_status=%x' \
            lake build --wfail "$TARGET"
          test -x ".lake/build/bin/$TARGET"

      - name: Report standalone build timing
        if: always()
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/cache-timing.txt" ]; then
            {
              printf '\nMathlib cache restoration: %s\n\n' "$PACKAGE"
              cat "$RUNNER_TEMP/cache-timing.txt"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/replay-timing.txt" ]; then
            {
              printf '\nStandalone build: %s / %s (restore caches: %s)\n\n' "$PACKAGE" "$TARGET" "$RESTORE_CACHES"
              cat "$RUNNER_TEMP/replay-timing.txt"
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  raft_traces:
    if: ${{ !inputs.standalone-replayers }}
    name: Raft scenario captures
    runs-on: [gha-vmss-d16av7-ci-c]
    container:
      image: mcr.microsoft.com/azurelinux/base/core:3.0
      options: --user root
    defaults:
      run:
        shell: bash
    timeout-minutes: 60

    steps:
      - name: Checkout dependencies
        run: |
          set -euo pipefail
          gpg --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
          tdnf -y update
          tdnf -y install ca-certificates git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build dependencies
        uses: ./.github/actions/install-ci-dependencies
        with:
          cache-python-packages: "false"

      - name: Generate scenario captures
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B "$RUNNER_TEMP/ccf-raft-build" -GNinja -DCMAKE_BUILD_TYPE=Debug -DVERBOSE_LOGGING=ON
          cmake --build "$RUNNER_TEMP/ccf-raft-build" --target raft_driver --parallel "$(( ($(nproc) + 1) >> 1 ))"
          uv run --no-project --with msgpack \
            ctest --test-dir "$RUNNER_TEMP/ccf-raft-build" -VV -R "^raft_scenario_test$" --no-tests=error

      - name: Upload Raft traces
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raft-scenario-traces
          path: ${{ runner.temp }}/ccf-raft-build/consensus/raw/*.ndjson
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  kv_traces:
    if: ${{ !inputs.standalone-replayers }}
    name: KV trace captures
    runs-on: [gha-vmss-d16av7-ci-c]
    container:
      image: mcr.microsoft.com/azurelinux/base/core:3.0
      options: --user root
    defaults:
      run:
        shell: bash
    timeout-minutes: 60

    steps:
      - name: Checkout dependencies
        run: |
          set -euo pipefail
          gpg --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
          tdnf -y update
          tdnf -y install ca-certificates git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install build dependencies
        uses: ./.github/actions/install-ci-dependencies
        with:
          cache-python-packages: "false"

      - name: Build and run instrumented KV unit tests
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B "$RUNNER_TEMP/ccf-kv-build" -GNinja \
            -DCMAKE_BUILD_TYPE=Debug -DCCF_KV_TRACING=ON
          cmake --build "$RUNNER_TEMP/ccf-kv-build" --target kv_test --parallel "$(( ($(nproc) + 1) >> 1 ))"
          ctest --test-dir "$RUNNER_TEMP/ccf-kv-build" -VV -R "^kv_test$" --no-tests=error

      - name: Generate KV captures
        run: |
          set -euo pipefail
          python3 tests/kv_trace_validation_test.py
          python3 tests/kv_trace_validation.py \
            --binary "$RUNNER_TEMP/ccf-kv-build/kv_test" --capture-only \
            --output "$RUNNER_TEMP/ccf-kv-build/kv-traces" --seeds 8 --timeout 900

      - name: Upload KV traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kv-traces
          path: ${{ runner.temp }}/ccf-kv-build/kv-traces/*/trace.ndjson
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Upload KV diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kv-trace-diagnostics
          path: |
            ${{ runner.temp }}/ccf-kv-build/kv-traces/
            ${{ runner.temp }}/ccf-kv-build/Testing/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  packages:
    if: ${{ !inputs.standalone-replayers }}
    name: Lean package (${{ matrix.package }})
    strategy:
      fail-fast: false
      matrix:
        package: [ccf-raft, common, consistency, disaster-recovery, kv]
    uses: ./.github/workflows/lean-package.yml
    with:
      package: ${{ matrix.package }}

  raft_replay:
    name: Replay native Raft traces
    needs: [raft_traces]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lean
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y elan
          elan toolchain install "$(cat lean/lean-toolchain)"

      - name: Restore Mathlib cache
        working-directory: lean/ccf-raft
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Build Raft replay
        working-directory: lean/ccf-raft
        run: |
          set -euo pipefail
          lake build --wfail ccfraft-replay

      - name: Download Raft traces
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: raft-scenario-traces
          path: ${{ runner.temp }}/raft-scenario-traces

      - name: Validate Raft traces
        shell: bash
        run: |
          set -euo pipefail
          shopt -s failglob
          for trace in "$RUNNER_TEMP"/raft-scenario-traces/*.ndjson; do
            echo "::group::Validate $trace"
            lean/ccf-raft/.lake/build/bin/ccfraft-replay "$trace"
            echo "::endgroup::"
          done

  models:
    name: Lean models and proofs
    needs: [packages, raft_traces, raft_replay, kv_traces, kv_replay]
    if: ${{ always() && !inputs.standalone-replayers }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Require every Lean check to succeed
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os

          expected = {
              "packages",
              "raft_traces",
              "raft_replay",
              "kv_traces",
              "kv_replay",
          }
          needs = json.loads(os.environ["NEEDS"])
          print(json.dumps(needs, indent=2))
          if set(needs) != expected or any(job["result"] != "success" for job in needs.values()):
              raise SystemExit("::error::Every required Lean job must conclude success")
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify scheduled package inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib

          expected = {"ccf-raft", "common", "consistency", "disaster-recovery", "kv"}
          actual = {config.parent.name for config in pathlib.Path("lean").glob("*/lakefile.toml")}
          if actual != expected:
              raise SystemExit(
                  f"::error::Lean package inventory changed: expected {sorted(expected)}, got {sorted(actual)}; "
                  "update scheduling, package validation, and formatting ownership"
              )
          PY

  kv_replay:
    name: Replay KV traces
    needs: [kv_traces]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lean
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y elan
          elan toolchain install "$(cat lean/lean-toolchain)"

      - name: Restore Mathlib cache
        working-directory: lean/kv
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Build KV replay
        working-directory: lean/kv
        run: |
          set -euo pipefail
          lake build --wfail kv-replay

      - name: Download KV traces
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kv-traces
          path: ${{ runner.temp }}/kv-traces

      - name: Validate KV traces
        run: |
          set -euo pipefail
          shopt -s failglob
          for trace in "$RUNNER_TEMP"/kv-traces/*/trace.ndjson; do
            echo "::group::Validate $trace"
            lean/kv/.lake/build/bin/kv-replay "$trace"
            echo "::endgroup::"
          done
