name: "Lean"

on:
  pull_request:
    paths:
      - "lean/**"
      - "tla/disaster-recovery/**"
      - ".github/workflows/lean.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  disaster-recovery:
    name: Disaster recovery model and proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y elan
          elan toolchain install "$(cat lean/disaster-recovery/lean-toolchain)"

      - name: Restore Mathlib cache
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Build and check canonical model
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          lake exe mk_all --check --lib DisasterRecovery
          lake build --wfail
          lake lint
          lake exe canonical-checks

  migration-evidence:
    name: Temporary migration evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lean and Rust
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y elan
          elan toolchain install "$(cat lean/disaster-recovery-migration/lean-toolchain)"
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build and check Rust model
        working-directory: tla/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked
          cargo build --locked
          cargo run --quiet --locked -- --nodes 2 check

      - name: Restore Mathlib cache
        working-directory: lean/disaster-recovery-migration
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Build and check migration model
        working-directory: lean/disaster-recovery-migration
        shell: bash
        run: |
          set -euo pipefail
          lake exe mk_all --check --lib DisasterRecoveryMigration
          lake build --wfail
          lake lint
          lake exe migration-semantic-checks
          lake exe migration-model-checker --nodes 3

      - name: Compare complete Rust and Lean graphs
        working-directory: lean/disaster-recovery-migration
        shell: bash
        run: |
          set -euo pipefail
          python3 compare.py --nodes 1 2 3
