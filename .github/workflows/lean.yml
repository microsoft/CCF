name: "Lean"

on:
  pull_request:
    paths:
      - "lean/**"
      - "**/*.lean"
      - "scripts/lean-format-checks.sh"
      - ".github/workflows/lean.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  models:
    name: Lean models and proofs
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y elan
          sort -u lean/*/lean-toolchain | while IFS= read -r toolchain; do
            elan toolchain install "$toolchain"
          done

      - name: Restore Mathlib caches
        shell: bash
        run: |
          set -euo pipefail
          for package in ccf-raft disaster-recovery; do
            (cd "lean/$package" && lake exe cache get)
          done

      - name: Build CCF Raft model and properties
        working-directory: lean/ccf-raft
        shell: bash
        run: |
          set -euo pipefail
          lake exe mk_all --check --module --lib CCFRaft
          lake build --wfail --fail-fast
          lake lint
          lake exe canonical-checks

      - name: Check CCF Raft with Lean's kernel
        working-directory: lean/ccf-raft
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          lake check --inadvisably-no-sandbox

      - name: Build and check disaster recovery model
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          lake exe mk_all --check --module --lib DisasterRecovery
          lake build --wfail --fail-fast
          lake lint

      - name: Check disaster recovery Mathlib linters
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          lake exe runLinter --no-build DisasterRecovery replayer.Main

      - name: Check recovery trace fixtures against their schema
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y python3-jsonschema
          python3 lean/disaster-recovery/replayer/check-schema.py \
            lean/disaster-recovery/replayer/fixtures/*/*.out

      - name: Check disaster recovery replay
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          ./replayer/check-fixtures.sh

      - name: Dump replays for the trace viewer
        shell: bash
        run: python3 lean/disaster-recovery/replayer/viewer/build.py

      - name: Check Lean formatting
        run: ./scripts/lean-format-checks.sh

  kernel-checks:
    name: Kernel checks (disaster-recovery)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lean and sandbox
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y elan bubblewrap
          elan toolchain install "$(cat lean/disaster-recovery/lean-toolchain)"

      - name: Restore Mathlib cache
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Check with Lean's kernel
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          lake check
