name: "Lean"

on:
  pull_request:
    paths:
      - "lean/**"
      - "**/*.lean"
      - "scripts/lean-format-checks.sh"
      - "src/kv/**"
      - "tests/kv_trace_validation.py"
      - "CMakeLists.txt"
      - ".github/workflows/lean.yml"
      - ".github/actions/lean-checks/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  disaster-recovery:
    name: Disaster recovery model and proofs
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y elan
          elan toolchain install "$(cat lean/disaster-recovery/lean-toolchain)"

      - name: Build and check canonical model
        uses: ./.github/actions/lean-checks
        with:
          working-directory: lean/disaster-recovery
          library: DisasterRecovery

  kv-contract:
    name: KV model and trace conformance
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/azurelinux/base/core:3.0
      options: --user root
    defaults:
      run:
        shell: bash
    env:
      # Must match lean/kv/lean-toolchain. The digest is the release archive's.
      LEAN_VERSION: 4.34.0
      LEAN_SHA256: caaa98356098c85dc0fcbbd28e1ec66f39eb6551829972b752ff20e1286b646b

    steps:
      - name: Bootstrap checkout dependencies
        run: |
          set -euo pipefail
          gpg --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
          tdnf -y update
          tdnf -y install ca-certificates git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install CCF build dependencies
        uses: ./.github/actions/install-ci-dependencies

      # Build native code before Lean, whose distribution bundles its own clang,
      # is added to PATH.
      - name: Build instrumented KV unit tests
        run: |
          set -euo pipefail
          cmake -S . -B build-kv-trace -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCCF_KV_TRACING=ON \
            -DCCF_KV_TRACE_CHECKER="$PWD/lean/kv/.lake/build/bin/kv_trace_check"
          cmake --build build-kv-trace --target kv_test --parallel 2

      - name: Run KV unit tests
        working-directory: build-kv-trace
        run: ./tests.sh -R '^kv_test$' -L unit --no-tests=error

      - name: Cache pinned Lean distribution
        id: lean-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccf-lean
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ env.LEAN_SHA256 }}

      - name: Download pinned Lean distribution
        if: steps.lean-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ccf-lean"
          cd "$RUNNER_TEMP/ccf-lean"
          curl --fail --location --retry 3 --output lean.tar.zst \
            "https://github.com/leanprover/lean4/releases/download/v$LEAN_VERSION/lean-$LEAN_VERSION-linux.tar.zst"
          echo "$LEAN_SHA256  lean.tar.zst" | sha256sum --check
          tar --zstd -xf lean.tar.zst
          rm lean.tar.zst

      - name: Add Lean to PATH
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean/kv/lean-toolchain)" = "leanprover/lean4:v$LEAN_VERSION"
          echo "$RUNNER_TEMP/ccf-lean/lean-$LEAN_VERSION-linux/bin" >> "$GITHUB_PATH"

      - name: Build and check KV model
        uses: ./.github/actions/lean-checks
        with:
          working-directory: lean/kv
          library: Kv

      - name: Check generated traces
        working-directory: build-kv-trace
        run: ./tests.sh -R '^kv_trace_validation$' -L kv_trace --no-tests=error

      - name: Upload conformance diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kv-contract-diagnostics
          path: |
            build-kv-trace/kv-traces/
            build-kv-trace/Testing/
