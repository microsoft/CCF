name: "Lean"

on:
  pull_request:
    paths:
      - "lean/**"
      - "**/*.lean"
      - "scripts/lean-format-checks.sh"
      - ".github/workflows/lean.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  disaster-recovery:
    name: Disaster recovery model and proofs
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y elan
          elan toolchain install "$(cat lean/disaster-recovery/lean-toolchain)"

      - name: Restore Mathlib cache
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Build and check canonical model
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          lake exe mk_all --check --module --lib DisasterRecovery
          lake build --wfail --fail-fast
          lake build CCF
          lake lint

      - name: Build and lint common infrastructure
        working-directory: lean/common
        shell: bash
        run: |
          set -euo pipefail
          lake build --wfail --fail-fast
          lake lint

      - name: Check Mathlib linters
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          lake exe runLinter --no-build CCF DisasterRecovery replayer.Main

      - name: Check recovery trace fixtures against their schema
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y python3-jsonschema
          python3 lean/disaster-recovery/replayer/check-schema.py \
            lean/disaster-recovery/replayer/fixtures/*/*.out

      - name: Check disaster recovery replay
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          ./replayer/check-fixtures.sh

      - name: Dump replays for the trace viewer
        shell: bash
        run: python3 lean/disaster-recovery/replayer/viewer/build.py

      - name: Check Lean formatting
        run: ./scripts/lean-format-checks.sh

  kernel-checks:
    name: Kernel checks (disaster-recovery)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y elan
          elan toolchain install "$(cat lean/disaster-recovery/lean-toolchain)"

      - name: Restore Mathlib cache
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Check with Lean's kernel
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          lake check --inadvisably-no-sandbox
