name: "Lean"

on:
  pull_request:
    paths:
      - "lean/**"
      - "**/*.lean"
      - "scripts/lean-format-checks.sh"
      - ".github/workflows/lean.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  models:
    name: Lean models and proofs
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lean and check prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y elan python3-jsonschema
          elan toolchain install "$(cat lean/lean-toolchain)"

      - name: Restore Mathlib caches
        shell: bash
        run: |
          set -euo pipefail
          for config in lean/*/lakefile.toml; do
            grep -q '^name = "mathlib"$' "$config" || continue
            package="$(dirname "$config")"
            echo "::group::Mathlib cache: $package"
            (cd "$package" && lake exe cache get)
            echo "::endgroup::"
          done

      - name: Lint packages
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/lean-format-checks.sh
          for config in lean/*/lakefile.toml; do
            package="$(dirname "$config")"
            echo "::group::Lint: $package"
            (cd "$package" && lake lint)
            echo "::endgroup::"
          done

      - name: Check packages
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          for config in lean/*/lakefile.toml; do
            package="$(dirname "$config")"
            (
              cd "$package"
              echo "::group::Build: $package"
              lake build --wfail --fail-fast
              echo "::endgroup::"
              echo "::group::Import coverage: $package"
              lake exe check-imports
              echo "::endgroup::"
              echo "::group::Kernel and axiom check: $package"
              lake check --inadvisably-no-sandbox
              echo "::endgroup::"
            )
          done

      - name: Check recovery trace fixtures against their schema
        shell: bash
        run: |
          set -euo pipefail
          python3 lean/disaster-recovery/replayer/check-schema.py \
            lean/disaster-recovery/replayer/fixtures/*/*.out

      - name: Check disaster recovery replay
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          ./replayer/check-fixtures.sh

      - name: Dump replays for the trace viewer
        shell: bash
        run: python3 lean/disaster-recovery/replayer/viewer/build.py
