name: "Lean"

on:
  pull_request:
    paths:
      - "lean/**"
      - "**/*.lean"
      - "scripts/lean-format-checks.sh"
      - ".github/workflows/lean.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  disaster-recovery:
    name: Disaster recovery model and proofs
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y elan
          elan toolchain install "$(cat lean/disaster-recovery/lean-toolchain)"

      - name: Restore Mathlib cache
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Build and check canonical model
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          lake exe mk_all --check --module --lib DisasterRecovery
          lake build --wfail --fail-fast DisasterRecovery canonical-checks disaster-recovery-replay
          lake lint
          lake exe canonical-checks

      - name: Check Mathlib linters
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          lake exe runLinter --no-build DisasterRecovery replayer.Main

      - name: Check recovery trace fixtures against their schema
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y python3-jsonschema
          python3 lean/disaster-recovery/replayer/check-schema.py \
            lean/disaster-recovery/replayer/fixtures/*/*.out

      - name: Build and check disaster recovery replay
        shell: bash
        run: |
          set -euo pipefail
          cd lean/disaster-recovery/replayer
          lake build --fail-fast
          lake lint
          ./check-fixtures.sh

      - name: Dump replays for the trace viewer
        shell: bash
        run: python3 lean/disaster-recovery/replayer/viewer/build.py

      - name: Check Lean formatting
        run: ./scripts/lean-format-checks.sh

  kernel-checks:
    name: Kernel checks (${{ matrix.package }})
    # Nanoda exhausts 11 GiB locally; use the existing 64 GiB VMSS pool.
    runs-on: [gha-vmss-d16av7-ci]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package:
          - disaster-recovery
          - disaster-recovery/replayer

    steps:
      - name: Restore workspace ownership
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lean and sandbox
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y elan bubblewrap
          elan toolchain install "$(cat lean/disaster-recovery/lean-toolchain)"

      - name: Restore Mathlib cache
        if: matrix.package == 'disaster-recovery'
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Check with all bundled kernels
        working-directory: lean/${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          if [[ "${{ matrix.package }}" == "disaster-recovery/replayer" ]]; then
            ./check-kernels.sh
          else
            lake check --paranoid
          fi
