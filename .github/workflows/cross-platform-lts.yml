name: Cross-platform LTS

on:
  pull_request:
  merge_group:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      from_version:
        description: CCF version to build on Azure Linux 3 (defaults to latest stable 7.x)
        required: false
        type: string
      to_version:
        description: CCF version to build on Azure Linux 4 (defaults to the checked-out commit)
        required: false
        type: string
      long:
        description: Also recover the ledger and snapshots of each supported LTS release in turn
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      long:
        description: Also recover the ledger and snapshots of each supported LTS release in turn
        required: false
        type: boolean
        default: false

# The group does not use github.workflow, which names the caller when this
# workflow is called, and would make this run cancel the caller.
concurrency:
  group: cross-platform-lts-${{ inputs.long && 'long' || 'short' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: read-all

env:
  PYTHON_VERSION: "3.12"
  AZL3_IMAGE: &azl3_image mcr.microsoft.com/azurelinux/base/core:3.0
  AZL4_IMAGE: &azl4_image mcr.microsoft.com/azurelinux/core:4
  AZL3_POOL: &azl3_pool gha-vmss-d16av7-ci
  AZL4_POOL: &azl4_pool gha-vmss-d16av7-ci
  INSTALL_ARCHIVE: ccf-install.tar.gz
  LTS_WORKSPACE: cross-platform-lts-workspace

jobs:
  configure:
    name: "Configure cross-platform LTS"
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      from_version: ${{ steps.versions.outputs.from_version }}
      to_version: ${{ steps.versions.outputs.to_version }}
      to_ref: ${{ steps.versions.outputs.to_ref }}
    steps:
      - name: "Resolve CCF versions"
        id: versions
        shell: bash
        env:
          FROM_VERSION: ${{ inputs.from_version }}
          GH_TOKEN: ${{ github.token }}
          TO_VERSION: ${{ inputs.to_version }}
        run: |
          set -euo pipefail
          from_version=$FROM_VERSION
          to_version=$TO_VERSION

          if [[ -z "$from_version" ]]; then
            release_data=$(gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --exclude-drafts \
              --exclude-pre-releases \
              --limit 1000 \
              --json tagName)
            tag=$(jq -r \
              '.[] | select(.tagName | test("^ccf-7\\.[0-9]+\\.[0-9]+$")) | .tagName' \
              <<< "$release_data" | sort -V | tail -n 1)
            if [[ -z "$tag" ]]; then
              echo "No published stable CCF 7.x release found" >&2
              exit 1
            fi
            from_version=${tag#ccf-}
          fi
          if [[ -z "$to_version" ]]; then
            # An empty ref builds the commit this workflow was triggered for.
            to_version=${GITHUB_SHA::10}
            to_ref=
          else
            to_ref=ccf-$to_version
          fi

          echo "from_version=$from_version" >> "$GITHUB_OUTPUT"
          echo "to_version=$to_version" >> "$GITHUB_OUTPUT"
          echo "to_ref=$to_ref" >> "$GITHUB_OUTPUT"

  build-install:
    name: "Build CCF ${{ matrix.ccf_version }} on ${{ matrix.name }}"
    needs: configure
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Azure Linux 3
            artifact: al3
            ccf_version: ${{ needs.configure.outputs.from_version }}
            ref: ccf-${{ needs.configure.outputs.from_version }}
            pool: *azl3_pool
            image: *azl3_image
          - name: Azure Linux 4
            artifact: al4
            ccf_version: ${{ needs.configure.outputs.to_version }}
            ref: ${{ needs.configure.outputs.to_ref }}
            pool: *azl4_pool
            image: *azl4_image
    runs-on: ["${{ matrix.pool }}"]
    container:
      image: ${{ matrix.image }}
      options: --user root

    steps:
      - name: "Install checkout dependencies"
        shell: bash
        run: |
          set -euo pipefail
          source /etc/os-release
          case "$VERSION_ID" in
            3.0)
              gpg --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
              tdnf -y update
              tdnf -y install ca-certificates git
              ;;
            4.0)
              dnf -y update
              dnf -y install ca-certificates git
              ;;
            *)
              echo "Unsupported Azure Linux version: $VERSION_ID" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "Checkout CCF ${{ matrix.ccf_version }}"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: version-source
          ref: ${{ matrix.ref }}

      - name: "Install build dependencies"
        uses: ./.github/actions/install-ci-dependencies
        with:
          cache-python-packages: false

      - name: "Build install tree"
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory /__w/CCF/CCF/version-source
          cmake -S version-source -B build -GNinja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$(nproc --all)"
          DESTDIR="$PWD/stage" cmake --install build
          tar -C stage -czf "$INSTALL_ARCHIVE" opt/ccf

      - name: "Upload install tree"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-platform-lts-${{ matrix.artifact }}
          path: ${{ env.INSTALL_ARCHIVE }}
          if-no-files-found: error

  test-upgrade:
    name: "Upgrade ${{ needs.configure.outputs.from_version }} AL3 to ${{ needs.configure.outputs.to_version }} AL4"
    needs: [configure, build-install]
    timeout-minutes: ${{ inputs.long && 120 || 60 }}
    runs-on: [*azl3_pool]

    steps:
      - name: "Restore workspace ownership"
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "Download Azure Linux 3 install"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cross-platform-lts-al3
          path: artifacts/al3

      - name: "Download Azure Linux 4 install"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cross-platform-lts-al4
          path: artifacts/al4

      - name: "Install test dependencies"
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_uv.sh "$RUNNER_TEMP/bin"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          uv python install "$PYTHON_VERSION"
          uv venv --python "$PYTHON_VERSION" env
          uv pip install --python env/bin/python \
            -r tests/requirements.txt \
            -e python

      - name: "Run cross-platform upgrade"
        shell: bash
        env:
          LONG: ${{ inputs.long }}
        run: |
          set -euo pipefail
          source env/bin/activate
          options=()
          if [[ "$LONG" == "true" ]]; then
            options+=(--check-ledger-compatibility)
          fi
          tests/docker/run_lts_compatibility.sh \
            "${options[@]}" \
            "artifacts/al3/$INSTALL_ARCHIVE" \
            "$AZL3_IMAGE" \
            "artifacts/al4/$INSTALL_ARCHIVE" \
            "$AZL4_IMAGE" \
            "$LTS_WORKSPACE"

      - name: "Upload logs"
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-platform-lts-logs
          path: ${{ env.LTS_WORKSPACE }}
          if-no-files-found: ignore
