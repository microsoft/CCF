name: Cross-platform LTS

on:
  pull_request:
    paths:
      - .github/workflows/cross-platform-lts.yml
      - tests/docker/lts_compatibility/Dockerfile
      - tests/docker/run_lts_compatibility.sh
      - tests/infra/github.py
      - tests/infra/remote.py
      - tests/lts_compatibility.py
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      from_version:
        description: CCF version to build on Azure Linux 3 (defaults to previous release)
        required: false
        type: string
      to_version:
        description: CCF version to build on Azure Linux 4 (defaults to latest release)
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: read-all

env:
  PYTHON_VERSION: "3.12"
  AZL3_IMAGE: &azl3_image mcr.microsoft.com/azurelinux/base/core:3.0
  AZL4_IMAGE: &azl4_image azlpubstagingacroxz2o4gw.azurecr.io/azurelinux/base/core:4.0
  AZL3_POOL: &azl3_pool 1ES.Pool=gha-vmss-d16av7-ci
  AZL4_POOL: &azl4_pool 1ES.Pool=gha-vmss-d16av7-ci
  INSTALL_ARCHIVE: ccf-install.tar.gz
  LTS_WORKSPACE: cross-platform-lts-workspace

jobs:
  configure:
    name: "Configure cross-platform LTS"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      from_version: ${{ steps.versions.outputs.from_version }}
      to_version: ${{ steps.versions.outputs.to_version }}
    steps:
      - name: "Resolve CCF versions"
        id: versions
        shell: bash
        env:
          FROM_VERSION: ${{ inputs.from_version }}
          GH_TOKEN: ${{ github.token }}
          TO_VERSION: ${{ inputs.to_version }}
        run: |
          set -euo pipefail
          release_tags=$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --exclude-drafts \
            --exclude-pre-releases \
            --limit 2 \
            --json tagName \
            --jq '.[].tagName')
          mapfile -t release_tags <<< "$release_tags"
          if [[ ${#release_tags[@]} -ne 2 ]] ||
            [[ "${release_tags[0]}" != ccf-* ]] ||
            [[ "${release_tags[1]}" != ccf-* ]]; then
            echo "Expected two stable CCF releases, found: ${release_tags[*]}" >&2
            exit 1
          fi

          from_version=${FROM_VERSION:-${release_tags[1]#ccf-}}
          to_version=${TO_VERSION:-${release_tags[0]#ccf-}}
          echo "from_version=$from_version" >> "$GITHUB_OUTPUT"
          echo "to_version=$to_version" >> "$GITHUB_OUTPUT"

  build-install:
    name: "Build CCF ${{ matrix.ccf_version }} on ${{ matrix.name }}"
    needs: configure
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Azure Linux 3
            artifact: al3
            ccf_version: ${{ needs.configure.outputs.from_version }}
            pool: *azl3_pool
            image: *azl3_image
          - name: Azure Linux 4
            artifact: al4
            ccf_version: ${{ needs.configure.outputs.to_version }}
            pool: *azl4_pool
            image: *azl4_image
    runs-on:
      [
        self-hosted,
        "${{ matrix.pool }}",
        "JobId=cross_platform_lts_build_${{ matrix.artifact }}-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}",
      ]
    container:
      image: ${{ matrix.image }}
      options: --user root

    steps:
      - name: "Install checkout dependencies"
        shell: bash
        run: |
          set -euo pipefail
          source /etc/os-release
          case "$VERSION_ID" in
            3.0)
              gpg --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
              tdnf -y update
              tdnf -y install ca-certificates git
              ;;
            4.0)
              dnf -y update
              dnf -y install ca-certificates git
              ;;
            *)
              echo "Unsupported Azure Linux version: $VERSION_ID" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "Checkout CCF ${{ matrix.ccf_version }}"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: version-source
          ref: ccf-${{ matrix.ccf_version }}

      - name: "Install build dependencies"
        uses: ./.github/actions/install-ci-dependencies
        with:
          cache-python-packages: false

      - name: "Build install tree"
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory /__w/CCF/CCF/version-source
          cmake -S version-source -B build -GNinja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel "$(nproc --all)"
          DESTDIR="$PWD/stage" cmake --install build
          tar -C stage -czf "$INSTALL_ARCHIVE" opt/ccf

      - name: "Upload install tree"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-platform-lts-${{ matrix.artifact }}
          path: ${{ env.INSTALL_ARCHIVE }}
          if-no-files-found: error

  test-upgrade:
    name: "Upgrade ${{ needs.configure.outputs.from_version }} AL3 to ${{ needs.configure.outputs.to_version }} AL4"
    needs: [configure, build-install]
    timeout-minutes: 60
    runs-on:
      [
        self-hosted,
        *azl3_pool,
        "JobId=cross_platform_lts_test-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}",
      ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "Download Azure Linux 3 install"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cross-platform-lts-al3
          path: artifacts/al3

      - name: "Download Azure Linux 4 install"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cross-platform-lts-al4
          path: artifacts/al4

      - name: "Install test dependencies"
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install_uv.sh "$RUNNER_TEMP/bin"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          uv python install "$PYTHON_VERSION"
          uv venv --python "$PYTHON_VERSION" env
          uv pip install --python env/bin/python \
            -r tests/requirements.txt \
            -e python

      - name: "Run cross-platform upgrade"
        shell: bash
        run: |
          set -euo pipefail
          source env/bin/activate
          tests/docker/run_lts_compatibility.sh \
            "artifacts/al3/$INSTALL_ARCHIVE" \
            "$AZL3_IMAGE" \
            "artifacts/al4/$INSTALL_ARCHIVE" \
            "$AZL4_IMAGE" \
            "$LTS_WORKSPACE"

      - name: "Upload logs"
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cross-platform-lts-logs
          path: ${{ env.LTS_WORKSPACE }}
          if-no-files-found: ignore
