name: "Lean Disaster Recovery Migration Evidence"

on:
  pull_request:
    paths:
      - "lean/disaster-recovery/**"
      - "lean/disaster-recovery-migration/**"
      - "tla/disaster-recovery/**"
      - ".github/workflows/lean-disaster-recovery-migration.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  migration-evidence:
    name: Temporary migration evidence
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lean and Rust
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y elan
          elan toolchain install "$(cat lean/disaster-recovery-migration/lean-toolchain)"
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build and check Rust model
        working-directory: tla/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked
          cargo build --locked
          cargo run --quiet --locked -- --nodes 2 check

      - name: Check canonical Lean package
        working-directory: lean/disaster-recovery
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get
          lake build
          lake env lean -DwarningAsError=true AxiomChecks.lean
          lake exe canonical-checks

      - name: Build and check migration Lean package
        working-directory: lean/disaster-recovery-migration
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get
          lake build
          lake env lean -DwarningAsError=true AxiomChecks.lean
          lake exe migration-semantic-checks
          lake exe migration-model-checker --nodes 3

      - name: Compare complete Rust and Lean graphs
        working-directory: lean/disaster-recovery-migration
        shell: bash
        run: |
          set -euo pipefail
          python3 compare.py --nodes 1 2 3
