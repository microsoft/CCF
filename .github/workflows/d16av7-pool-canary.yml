name: "D16ads v7 Pool Canary"

on:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  primary:
    name: "Primary Pool"
    runs-on:
      [
        self-hosted,
        1ES.Pool=gha-vmss-d16av7-ci,
        "JobId=d16av7_canary_primary-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}",
      ]
    steps:
      - name: "Inspect and validate runner"
        shell: bash
        run: |
          set -euo pipefail

          uname -a
          cat /etc/os-release
          lscpu
          free -h
          lsblk -o NAME,MODEL,SIZE,TYPE,TRAN,MOUNTPOINTS

          logical_cpus="$(nproc --all)"
          memory_kib="$(awk '/^MemTotal:/ { print $2 }' /proc/meminfo)"

          test "$logical_cpus" -eq 16
          test "$memory_kib" -ge $((60 * 1024 * 1024))
          lsblk -dno NAME,TRAN | awk \
            '$1 ~ /^nvme/ || $2 == "nvme" { found = 1 } END { exit !found }'

  backup:
    name: "Backup Pool"
    runs-on:
      [
        self-hosted,
        1ES.Pool=gha-vmss-d16av7-ci-b,
        "JobId=d16av7_canary_backup-${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}",
      ]
    steps:
      - name: "Inspect and validate runner"
        shell: bash
        run: |
          set -euo pipefail

          uname -a
          cat /etc/os-release
          lscpu
          free -h
          lsblk -o NAME,MODEL,SIZE,TYPE,TRAN,MOUNTPOINTS

          logical_cpus="$(nproc --all)"
          memory_kib="$(awk '/^MemTotal:/ { print $2 }' /proc/meminfo)"

          test "$logical_cpus" -eq 16
          test "$memory_kib" -ge $((60 * 1024 * 1024))
          lsblk -dno NAME,TRAN | awk \
            '$1 ~ /^nvme/ || $2 == "nvme" { found = 1 } END { exit !found }'
