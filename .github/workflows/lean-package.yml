name: Lean package

on:
  workflow_call:
    inputs:
      package:
        description: Lean package directory under lean/
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Check ${{ inputs.package }}
    runs-on: [gha-vmss-d16av7-ci]
    container:
      image: ubuntu:26.04
      options: --user root
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PACKAGE: ${{ inputs.package }}

    steps:
      - name: Install container prerequisites
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates git curl tar zstd build-essential libgmp-dev \
            elan python3-jsonschema jq
          echo "ELAN_HOME=$RUNNER_TEMP/elan" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate package
        run: |
          set -euo pipefail
          case "$PACKAGE" in
            consensus|common|consistency|disaster-recovery|kv|tls) ;;
            *)
              echo "::error::Unsupported Lean package: $PACKAGE"
              exit 1
              ;;
          esac
          test -f "lean/$PACKAGE/lakefile.toml"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install Lean and check prerequisites
        run: |
          set -euo pipefail
          elan run --install "$(cat lean/lean-toolchain)" lean --version

      - name: Restore dependency builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/${{ inputs.package }}/.lake/packages
          key: lean-deps-v2-vmss-ubuntu-26.04-${{ runner.arch }}-${{ inputs.package }}-${{ hashFiles('lean/lean-toolchain', format('lean/{0}/lake-manifest.json', inputs.package), format('lean/{0}/lakefile.toml', inputs.package), 'lean/common/lake-manifest.json', 'lean/common/lakefile.toml', '.github/workflows/lean-package.yml') }}

      - name: Build, kernel and axiom check
        working-directory: lean/${{ inputs.package }}
        run: |
          set -euo pipefail
          if [ "$PACKAGE" = "consensus" ]; then
            original="$(mktemp)"
            cp lakefile.toml "$original"
            trap 'cp "$original" lakefile.toml; rm "$original"' EXIT
            for target in Consensus consensus-replay; do
              echo "::group::Kernel and axiom check: $target"
              sed "s/^defaultTargets = .*/defaultTargets = [\"$target\"]/" "$original" > lakefile.toml
              lake check --inadvisably-no-sandbox
              echo "::endgroup::"
            done
            cp "$original" lakefile.toml
            rm "$original"
            trap - EXIT
          else
            lake check --inadvisably-no-sandbox
          fi

      - name: Import coverage and architecture
        working-directory: lean/${{ inputs.package }}
        run: |
          set -euo pipefail
          lake exe check-imports

      - name: Check formatting
        if: inputs.package != 'common'
        run: |
          set -euo pipefail
          ./scripts/lean-format-checks.sh "$PACKAGE"

      - name: Lint
        working-directory: lean/${{ inputs.package }}
        run: |
          set -euo pipefail
          if [ "$PACKAGE" != "common" ]; then
            lake build ccf_common/+CCF
          fi
          lake lint

      - name: Build CCF consensus replay
        if: inputs.package == 'consensus'
        working-directory: lean/consensus
        run: |
          set -euo pipefail
          lake build --wfail consensus-replay

      - name: Validate CCF consensus trace fixtures
        if: inputs.package == 'consensus'
        run: |
          set -euo pipefail
          shopt -s failglob
          for trace in lean/consensus/replay/fixtures/valid/*.ndjson; do
            echo "::group::Validate $trace"
            lean/consensus/.lake/build/bin/consensus-replay "$trace"
            echo "::endgroup::"
          done

      - name: Reject invalid CCF consensus trace fixtures
        if: inputs.package == 'consensus'
        run: |
          set -euo pipefail
          shopt -s failglob
          for trace in lean/consensus/replay/fixtures/invalid/*.ndjson; do
            echo "::group::Reject $trace"
            status=0
            lean/consensus/.lake/build/bin/consensus-replay "$trace" || status=$?
            if [ "$status" -ne 1 ]; then
              echo "::error::$trace: expected rejection (exit 1), got exit $status"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Check recovery trace fixtures against their schema
        if: inputs.package == 'disaster-recovery'
        run: |
          set -euo pipefail
          python3 lean/disaster-recovery/replayer/check-schema.py \
            lean/disaster-recovery/replayer/fixtures/*/*.out

      - name: Check disaster recovery replay
        if: inputs.package == 'disaster-recovery'
        working-directory: lean/disaster-recovery
        run: |
          set -euo pipefail
          ./replayer/check-fixtures.sh

      - name: Build KV replay
        if: inputs.package == 'kv'
        working-directory: lean/kv
        run: |
          set -euo pipefail
          lake build --wfail kv-replay

      - name: Check KV replay fixtures
        if: inputs.package == 'kv'
        working-directory: lean/kv
        run: |
          set -euo pipefail
          ./replayer/check-fixtures.sh

      - name: Build consistency replay
        if: inputs.package == 'consistency'
        working-directory: lean/consistency
        run: |
          set -euo pipefail
          lake build --wfail consistency-replay

      - name: Validate consistency trace fixtures
        if: inputs.package == 'consistency'
        run: |
          set -euo pipefail
          shopt -s failglob
          for trace in lean/consistency/replayer/fixtures/valid/*.ndjson; do
            echo "::group::Validate $trace"
            lean/consistency/.lake/build/bin/consistency-replay "$trace"
            echo "::endgroup::"
          done

      - name: Reject invalid consistency trace fixtures
        if: inputs.package == 'consistency'
        run: |
          set -euo pipefail
          shopt -s failglob
          for trace in lean/consistency/replayer/fixtures/invalid/*.ndjson; do
            echo "::group::Reject $trace"
            status=0
            lean/consistency/.lake/build/bin/consistency-replay "$trace" || status=$?
            if [ "$status" -ne 1 ]; then
              echo "::error::$trace: expected rejection (exit 1), got exit $status"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Dump replays for the trace viewer
        if: inputs.package == 'disaster-recovery'
        run: |
          set -euo pipefail
          python3 lean/disaster-recovery/replayer/viewer/build.py
