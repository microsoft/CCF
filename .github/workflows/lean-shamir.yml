name: "Lean Shamir"

# Checks the experimental Rust Shamir backend: that its Lean model is the one
# Aeneas extracts from the production Rust core, and that the proofs about that
# model hold. They need Aeneas, CSLib and Mathlib, unlike the packages checked
# by lean.yml, so this only runs when the Rust core, the model or the proofs
# change.
on:
  pull_request:
    paths:
      - "lean/shamir/**"
      - "lean/common/**"
      - "lean/lean-toolchain"
      - "src/rust/**"
      - "src/crypto/sharing_ffi.h"
      - "scripts/extract-shamir.sh"
      - "scripts/check-shamir.sh"
      - "scripts/generate-shamir-header.sh"
      - "scripts/lean-format-checks.sh"
      - ".github/workflows/lean-shamir.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extraction:
    name: Reproduce Rust Shamir extraction and C header
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract the production Rust core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/shamir-tools
          gh release download nightly-2026.10.20-fc321a2 \
            --repo AeneasVerif/aeneas --pattern aeneas-linux-x86_64.tar.gz \
            --dir build/shamir-tools
          echo '4b444e72e1e0bc475e952821bc081eb15665c984fd8032636c0346e766675794  build/shamir-tools/aeneas-linux-x86_64.tar.gz' | sha256sum --check
          tar -xzf build/shamir-tools/aeneas-linux-x86_64.tar.gz -C build/shamir-tools
          rustup toolchain install nightly-2026-09-17 --profile minimal \
            --component rustc-dev,rust-src,llvm-tools,miri
          AENEAS_BIN="$PWD/build/shamir-tools/aeneas" \
            CHARON_BIN="$PWD/build/shamir-tools/charon" \
            bash scripts/extract-shamir.sh
          git diff --exit-code -- lean/shamir/Generated/CcfShamir.lean
          cargo +nightly-2026-09-17 test \
            --manifest-path src/rust/shamir/Cargo.toml --locked -j1

      - name: Run the C ABI tests under Miri
        run: |
          set -euo pipefail
          cargo +nightly-2026-09-17 miri test \
            --manifest-path src/rust/Cargo.toml --locked --lib -j1
          MIRIFLAGS="-Zmiri-tree-borrows -Zmiri-strict-provenance" \
            cargo +nightly-2026-09-17 miri test \
            --manifest-path src/rust/Cargo.toml --locked --lib -j1

      - name: Check the generated C header
        run: |
          set -euo pipefail
          bash scripts/install_uv.sh "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          cargo +nightly-2026-09-17 install cbindgen --version 0.29.4 --locked
          RUSTUP_TOOLCHAIN=nightly-2026-09-17 \
            bash scripts/generate-shamir-header.sh --check

  proofs:
    name: Check Shamir model and proofs
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      # The Aeneas and Mathlib imports are memory-hungry on hosted runners.
      LEAN_NUM_THREADS: 1

    steps:
      - name: Install prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y elan

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lean
        run: |
          set -euo pipefail
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          elan run --install "$(cat lean/lean-toolchain)" lean --version

      - name: Restore dependency builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/shamir/.lake/packages
          key: lean-deps-v3-ubuntu-26.04-${{ runner.arch }}-shamir-${{ hashFiles('lean/lean-toolchain', 'lean/shamir/lake-manifest.json', 'lean/shamir/lakefile.toml', 'lean/common/lake-manifest.json', 'lean/common/lakefile.toml', '.github/workflows/lean-shamir.yml') }}

      - name: Restore Mathlib cache
        working-directory: lean/shamir
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Build, kernel and axiom check
        run: |
          set -euo pipefail
          bash scripts/check-shamir.sh --inadvisably-no-sandbox

      - name: Import coverage and architecture
        working-directory: lean/shamir
        run: |
          set -euo pipefail
          lake exe check-imports

      - name: Check formatting
        run: |
          set -euo pipefail
          ./scripts/lean-format-checks.sh shamir

      - name: Lint
        working-directory: lean/shamir
        run: |
          set -euo pipefail
          lake lint
