name: Ubuntu migration validation

on:
  push:
    branches:
      - achamayou-ubuntu-26-04-migration

permissions: read-all

jobs:
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/prettier-checks.sh
      - run: ./scripts/ascii-checks.sh
      - run: ./scripts/copyright-checks.sh
      - run: ./scripts/todo-checks.sh

  release-tools:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - name: Exercise release downloads and NPM publishing without writes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source /etc/os-release
          test "$VERSION_ID" = "26.04"
          gh --version
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" \
            --exclude-drafts --exclude-pre-releases --limit 1 \
            --json tagName --jq '.[0].tagName')
          test -n "$tag"
          gh release download --repo "$GITHUB_REPOSITORY" "$tag" -D release-assets
          find release-assets -maxdepth 1 -type f \( -name '*.whl' -o -name '*.sigstore.json' \) -delete
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -gt 0
          package="./release-assets/microsoft-ccf-app-${tag#ccf-}.tgz"
          test -f "$package"
          npm publish "$package" --dry-run --access public --tag latest
          ./scripts/extract-release-notes.py
          gh release create --help > /dev/null
          gh release upload --help > /dev/null
          gh api "repos/${GITHUB_REPOSITORY}/issues?per_page=1" > /dev/null

  docs:
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/azurelinux/base/core:3.0
    steps:
      - name: Checkout dependencies
        shell: bash
        run: |
          gpg --import /etc/pki/rpm-gpg/MICROSOFT-RPM-GPG-KEY
          tdnf -y update
          tdnf -y install ca-certificates git
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install dependencies
        uses: ./.github/actions/install-ci-dependencies
        with:
          python-requirements: doc/requirements.txt,doc/historical_ccf_requirements.txt
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          rm /tmp/elan-init.sh
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean/lean-toolchain)"
          echo "${HOME}/.elan/bin" >> "$GITHUB_PATH"
      - name: Build Documentation
        shell: bash
        run: |
          set -x
          python3 -m venv --without-pip env
          source env/bin/activate
          uv pip install -e ./python
          uv pip install -r doc/requirements.txt
          uv pip install -r doc/historical_ccf_requirements.txt
          python3 scripts/build-docs.py -D smv_remote_whitelist=origin doc build/html
      - name: Set up top-level directory
        shell: bash
        run: |
          set -x
          cd build/html
          touch .nojekyll
          cp ../../doc/index.html .
      - name: Upload pages without deploying
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/html
