name = "mathlib_equivalence"
version = "0.1.0"
moreLeanArgs = ["-DwarningAsError=true"]
leanOptions = { autoImplicit = false }
defaultTargets = ["MathlibEquivalence"]

[[require]]
name = "ccf_common"
path = "../common"
copy = false

[[require]]
name = "consensus"
path = "../consensus"
copy = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "MathlibEquivalence"
