name = "mathlib_subset_check"
version = "0.1.0"
defaultTargets = ["mathlib-subset-check"]

# The upstream that `../mathlib-subset` is checked against. Keep `rev` in sync with
# the version stated in `../mathlib-subset/README.md`.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_exe]]
name = "mathlib-subset-check"
root = "Main"
supportInterpreter = true
