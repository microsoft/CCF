name = "ccf_raft"
version = "0.1.0"
moreLeanArgs = ["-DwarningAsError=true"]
lintDriver = "axiomAudit/\u00abaxiom-audit\u00bb"
lintDriverArgs = ["--root", "CCFRaft"]
defaultTargets = ["CCFRaft", "canonical-checks", "ccfraft-replay"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[require]]
name = "axiomAudit"
git = "https://github.com/leanprover-community/axiom-audit.git"
rev = "46024e005996495c65ef609368e11ab39c4222e3" # v0.1.2

[[lean_lib]]
name = "CCFRaft"

[[lean_exe]]
name = "canonical-checks"
srcDir = "tests"
root = "CanonicalTests"

[[lean_exe]]
name = "ccfraft-replay"
srcDir = "replay"
root = "ReplayMain"
