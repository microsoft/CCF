name = "ccf_raft"
version = "0.1.0"
moreLeanArgs = ["-DwarningAsError=true"]
defaultTargets = ["CCFRaft", "canonical-checks", "ccfraft-replay"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.1"

[[lean_lib]]
name = "CCFRaft"

[[lean_exe]]
name = "canonical-checks"
root = "CanonicalTests"

[[lean_exe]]
name = "ccfraft-replay"
root = "ReplayMain"
