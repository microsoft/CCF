name = "ccf_raft"
version = "0.1.0"
moreLeanArgs = ["-DwarningAsError=true"]
leanOptions = { autoImplicit = false }
builtinLint = true
defaultTargets = ["CCFRaft", "canonical-checks", "ccfraft-replay", "replay-checks"]

[[require]]
name = "ccf_common"
git = "https://github.com/microsoft/CCF.git"
rev = "cc22c58d61e628b90f1f5b49194c7e6722f1ec2c" # Merged #8573
subDir = "lean/common"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[require]]
name = "leanfmt"
git = "https://github.com/duckki/leanfmt.git"
rev = "65d69c8dc2dfd0aa69fd4132d48f38b7af9a57ef" # v0.4.5

[[lean_lib]]
name = "CCFRaft"

[[lean_exe]]
name = "canonical-checks"
root = "CCFRaft.Tests.CanonicalTests"

[[lean_exe]]
name = "ccfraft-replay"
srcDir = "replay"
root = "ReplayMain"

[[lean_exe]]
name = "replay-checks"
srcDir = "replay/tests"
root = "Main"
