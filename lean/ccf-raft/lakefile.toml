name = "ccf_raft"
version = "0.1.0"
moreLeanArgs = ["-DwarningAsError=true", "-Dtrace.Kernel=true"]
leanOptions = { autoImplicit = false }
builtinLint = true
defaultTargets = ["CCFRaft", "ccfraft-replay"]

[[require]]
name = "ccf_common"
path = "../common"
copy = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[require]]
name = "leanfmt"
git = "https://github.com/duckki/leanfmt.git"
rev = "65d69c8dc2dfd0aa69fd4132d48f38b7af9a57ef" # v0.4.5

[[lean_lib]]
name = "CCFRaft"

[[lean_exe]]
name = "ccfraft-replay"
srcDir = "replay"
root = "ReplayMain"
