name = "ccf_raft"
version = "0.1.0"
moreLeanArgs = ["-DwarningAsError=true"]
# Quote the hyphenated executable name for Lean's name parser.
lintDriver = "axiomAudit/\u00abaxiom-audit\u00bb"
lintDriverArgs = ["--root", "CCFRaft"]
defaultTargets = ["CCFRaft", "canonical-checks", "ccfraft-replay"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[require]]
name = "axiomAudit"
git = "https://github.com/leanprover-community/axiom-audit.git"
rev = "46024e005996495c65ef609368e11ab39c4222e3" # v0.1.2

[[require]]
name = "leanfmt"
git = "https://github.com/duckki/leanfmt.git"
rev = "v0.4.5"

[[lean_lib]]
name = "CCFRaft"

[[lean_exe]]
name = "canonical-checks"
root = "CCFRaft.Tests.CanonicalTests"

[[lean_exe]]
name = "ccfraft-replay"
srcDir = "replay"
root = "ReplayMain"
