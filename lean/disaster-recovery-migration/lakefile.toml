name = "disaster_recovery_migration"
version = "0.1.0"
moreLeanArgs = ["-DwarningAsError=true"]
# Quote the hyphenated executable name for Lean's name parser.
lintDriver = "axiomAudit/\u00abaxiom-audit\u00bb"
lintDriverArgs = ["--root", "DisasterRecoveryMigration"]
defaultTargets = [
  "DisasterRecoveryMigration",
  "migration-model-checker",
  "migration-semantic-checks",
  "migration-exporter",
]

[[require]]
name = "disaster_recovery"
path = "../disaster-recovery"

[[lean_lib]]
name = "DisasterRecoveryMigration"

[[lean_exe]]
name = "migration-model-checker"
root = "Main"

[[lean_exe]]
name = "migration-semantic-checks"
root = "Tests"

[[lean_exe]]
name = "migration-exporter"
root = "ExportMain"
