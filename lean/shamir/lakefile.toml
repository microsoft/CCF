name = "ccf_shamir"
version = "0.1.0"
defaultTargets = ["Generated", "Shamir"]
moreLeanArgs = ["-DwarningAsError=true", "-M", "4500"]
builtinLint = true
lintDriver = "batteries/runLinter"
lintDriverArgs = ["--no-build", "Shamir"]

[leanOptions]
autoImplicit = false

[[require]]
name = "ccf_common"
path = "../common"
copy = false

[[require]]
name = "aeneas"
git = "https://github.com/AeneasVerif/aeneas"
subDir = "backends/lean"
rev = "2e3d4488280bb8a95411db81019a7854a784861f"

[[require]]
name = "cslib"
git = "https://github.com/leanprover/cslib"
rev = "22b39634cb3dc80d829683ad1f65c5680b722309" # v4.36.0

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[require]]
name = "leanfmt"
git = "https://github.com/duckki/leanfmt.git"
rev = "65d69c8dc2dfd0aa69fd4132d48f38b7af9a57ef" # v0.4.5

[[lean_lib]]
name = "Generated"

[[lean_lib]]
name = "Shamir"

# The extracted model keeps Aeneas's own lint settings.
[lean_lib.leanOptions]
linter.extra = true
linter.loopingSimpArgs = true
linter.missingDocs = true
linter.omit = true
linter.redundantVisibility = true
linter.unusedVariables.analyzeTactics = true
