name = "consistency"
version = "0.1.0"
moreLeanArgs = ["-DwarningAsError=true", "-Dtrace.Kernel=true"]
leanOptions = { autoImplicit = false }
builtinLint = true
defaultTargets = ["consistency", "consistency-replay"]

[[require]]
name = "ccf_common"
path = "../common"
copy = false

[[require]]
name = "leanfmt"
git = "https://github.com/duckki/leanfmt.git"
rev = "65d69c8dc2dfd0aa69fd4132d48f38b7af9a57ef" # v0.4.5

[[lean_lib]]
name = "consistency"

[[lean_exe]]
name = "consistency-replay"
root = "replayer.Main"
