name = "disaster_recovery"
version = "0.1.0"
defaultTargets = [
  "DisasterRecovery",
  "disaster-recovery",
  "semantic-checks",
  "canonical-checks",
  "trace-validator",
]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "DisasterRecovery"

[[lean_exe]]
name = "disaster-recovery"
root = "Main"

[[lean_exe]]
name = "semantic-checks"
root = "Tests"

[[lean_exe]]
name = "canonical-checks"
root = "CanonicalTests"

[[lean_exe]]
name = "trace-validator"
root = "TraceMain"
