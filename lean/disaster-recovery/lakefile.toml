name = "disaster_recovery"
version = "0.1.0"
moreLeanArgs = ["-DwarningAsError=true"]
# Quote the hyphenated executable name for Lean's name parser.
lintDriver = "axiomAudit/\u00abaxiom-audit\u00bb"
lintDriverArgs = ["--root", "DisasterRecovery"]
defaultTargets = [
  "DisasterRecovery",
  "canonical-checks",
]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[require]]
name = "axiomAudit"
git = "https://github.com/leanprover-community/axiom-audit.git"
rev = "46024e005996495c65ef609368e11ab39c4222e3" # v0.1.2

[[lean_lib]]
name = "DisasterRecovery"

[[lean_exe]]
name = "canonical-checks"
root = "CanonicalTests"
