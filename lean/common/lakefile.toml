name = "ccf_common"
version = "0.1.0"
moreLeanArgs = ["-DwarningAsError=true"]
builtinLint = true
defaultTargets = ["CCF"]

[leanOptions]
autoImplicit = false
linter.extra = true
linter.loopingSimpArgs = true
linter.missingDocs = true
linter.omit = true
linter.redundantVisibility = true
linter.unusedVariables.analyzeTactics = true

[[lean_lib]]
name = "CCF"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"
