name = "kv"
version = "0.1.0"
moreLeanArgs = ["-DwarningAsError=true"]
builtinLint = true
defaultTargets = [
  "Kv",
  "kv-replay",
]

[leanOptions]
autoImplicit = false
linter.extra = true
linter.loopingSimpArgs = true
linter.missingDocs = true
linter.omit = true
linter.redundantVisibility = true
linter.unusedVariables.analyzeTactics = true

[[require]]
name = "ccf_common"
path = "../common"
copy = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[require]]
name = "leanfmt"
git = "https://github.com/duckki/leanfmt.git"
rev = "65d69c8dc2dfd0aa69fd4132d48f38b7af9a57ef" # v0.4.5

[[lean_lib]]
name = "Kv"

[[lean_exe]]
name = "kv-replay"
root = "replayer.Main"
