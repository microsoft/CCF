parameters:
- name: IsOfficialBuild
  type: boolean
  default: false

stages:
- stage: setup
  jobs:
  - job: setup
    pool:
      type: linux
    steps:
    - task: onebranch.pipeline.version@1
      displayName: Set build number
      inputs:
        system: Patch
        major: "1"
        minor: "0"
        ${{ if not(parameters.IsOfficialBuild) }}:
          tag: pr
        ${{ elseif startsWith(variables['Build.SourceBranch'], 'refs/tags/ccf-') }}:
          tag: official
        ${{ else }}:
          tag: ci
        name: ccf

- stage: build
  dependsOn: setup
  jobs:
  - job: virtual_a
    displayName: Checks, Python, unit, and bucket A
    pool:
      type: linux
      isCustom: true
      name: ado-ccf-pool
    variables:
      ob_outputDirectory: $(Build.SourcesDirectory)/out
    steps:
    - checkout: self
      path: s/
      clean: true
      submodules: recursive
      fetchTags: true
      fetchDepth: 0
      lfs: false
    - script: bash .pipelines/scripts/run-ci.sh virtual-a
      displayName: Run Virtual A workload
      env:
        CI: $(CI)

  - job: virtual_b
    displayName: Bucket B
    pool:
      type: linux
      isCustom: true
      name: ado-ccf-pool
    variables:
      ob_outputDirectory: $(Build.SourcesDirectory)/out
    steps:
    - checkout: self
      path: s/
      clean: true
      submodules: recursive
      fetchTags: true
      fetchDepth: 0
      lfs: false
    - script: bash .pipelines/scripts/run-ci.sh virtual-b
      displayName: Run Virtual B workload
      env:
        CI: $(CI)

  - job: virtual_c
    displayName: Bucket C and partitions
    pool:
      type: linux
      isCustom: true
      name: ado-ccf-pool
    variables:
      ob_outputDirectory: $(Build.SourcesDirectory)/out
    steps:
    - checkout: self
      path: s/
      clean: true
      submodules: recursive
      fetchTags: true
      fetchDepth: 0
      lfs: false
    - script: bash .pipelines/scripts/run-ci.sh virtual-c
      displayName: Run Virtual C workload
      env:
        CI: $(CI)

  - job: snp_genoa
    displayName: SNP Genoa
    pool:
      type: linux
      isCustom: true
      name: ado-ccf-snp-pool
    variables:
      ob_outputDirectory: $(Build.SourcesDirectory)/out
    steps:
    - checkout: self
      path: s/
      clean: true
      submodules: recursive
      fetchTags: true
      fetchDepth: 0
      lfs: false
    - script: bash .pipelines/scripts/run-snp-ci.sh
      displayName: Run SNP Genoa workload
      target: host
      env:
        CI: $(CI)
        CCF_TEST_SYNC_AFTER_SETUP: "1"
        ELECTION_TIMEOUT_MS: "10000"

- ${{ if parameters.IsOfficialBuild }}:
  - stage: release_artifacts
    displayName: Build release artifacts
    dependsOn: build
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/ccf-'))
    jobs:
    - job: ccf_release
      displayName: Build and reproduce CCF release
      pool:
        type: linux
        isCustom: true
        name: ado-ccf-pool
      variables:
        ob_outputDirectory: $(Build.SourcesDirectory)/out
      steps:
      - checkout: self
        path: s/
        clean: true
        submodules: recursive
        fetchTags: true
        fetchDepth: 0
        lfs: false
      - script: bash .pipelines/scripts/build-release-artifacts.sh
        displayName: Build and reproduce release artifacts
        env:
          CI: $(CI)
