trigger: none
pr: none

parameters:
  - name: publish
    displayName: Publish to npm through ESRP
    type: boolean
    default: false

variables:
  - name: LinuxContainerImage
    value: mcr.microsoft.com/onebranch/azurelinux/build:3.0
  # Defined in Azure DevOps Library and authorized for this pipeline.
  - group: ccf-esrp-pypi

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates
  parameters:
    globalSdl:
      perStage:
        sdl_sources:
          checkout_all_repos: true
      tsa:
        enabled: false
      policheck:
        break: true
    release:
      category: NonAzure
    stages:
      - stage: build
        jobs:
          - job: ccf_app
            displayName: Build CCF npm package
            pool:
              type: linux
            variables:
              ob_outputDirectory: $(Build.SourcesDirectory)/out
            steps:
              - checkout: self
                path: s/
                fetchTags: true
                fetchDepth: 0
                lfs: false
              - task: NodeTool@0
                displayName: Use Node.js 24
                inputs:
                  versionSpec: 24.x
              - script: bash .pipelines/scripts/build-npm-package.sh
                name: package
                displayName: Build release tarball
                env:
                  BUILD_SOURCEBRANCH: $(Build.SourceBranch)

      - stage: release
        displayName: Publish CCF npm package
        dependsOn: build
        condition: and(succeeded(), ${{ eq(parameters.publish, true) }}, startsWith(variables['Build.SourceBranch'], 'refs/tags/ccf-'))
        variables:
          - name: ob_release_environment
            value: Production
          - name: npm_dist_tag
            value: $[ stageDependencies.build.ccf_app.outputs['package.npm_dist_tag'] ]
        jobs:
          - job: npm
            displayName: Release @microsoft/ccf-app
            pool:
              type: release
            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - input: pipelineArtifact
                  artifactName: drop_build_ccf_app
                  targetPath: $(Pipeline.Workspace)/npm
            steps:
              - task: CopyFiles@2
                displayName: Stage npm tarball for ESRP
                inputs:
                  sourceFolder: $(Pipeline.Workspace)/npm
                  contents: "*.tgz"
                  targetFolder: $(Pipeline.Workspace)/esrp_dist
                  flattenFolders: true
              - task: EsrpRelease@14
                displayName: ESRP release to npm
                inputs:
                  connectedservicename: $(ESRP_SERVICE_CONNECTION)
                  usemanagedidentity: false
                  keyvaultname: $(ESRP_KEY_VAULT_NAME)
                  signcertname: $(ESRP_SIGN_CERT_NAME)
                  authcertname: $(ESRP_AUTH_CERT_NAME)
                  clientid: $(ESRP_CLIENT_ID)
                  contenttype: npm
                  intent: PackageDistribution
                  productstate: $(npm_dist_tag)
                  waitforreleasecompletion: true
                  folderlocation: $(Pipeline.Workspace)/esrp_dist
                  owners: $(ESRP_OWNERS)
                  approvers: $(ESRP_APPROVERS)
                  mainpublisher: $(ESRP_MAIN_PUBLISHER)
                  domaintenantid: $(ESRP_DOMAIN_TENANT_ID)
