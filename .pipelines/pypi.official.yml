trigger: none
pr: none

variables:
  - name: LinuxContainerImage
    value: mcr.microsoft.com/onebranch/azurelinux/build:3.0
  # Defined in Azure DevOps Library and authorized for this pipeline.
  - group: ccf-esrp-pypi

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates
  parameters:
    globalSdl:
      perStage:
        sdl_sources:
          checkout_all_repos: true
      tsa:
        enabled: false
      policheck:
        break: true
    release:
      category: NonAzure
    stages:
      - stage: build
        jobs:
          - job: ccf
            displayName: Build and validate CCF wheel
            pool:
              type: linux
            variables:
              ob_outputDirectory: $(Build.SourcesDirectory)/out
            steps:
              - checkout: self
                path: s/
                fetchTags: true
                fetchDepth: 0
                lfs: false
              - script: bash .pipelines/scripts/build-pypi-package.sh
                name: package
                displayName: Build and validate release wheel

      - stage: release
        displayName: Publish CCF wheel to PyPI
        dependsOn: build
        condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/ccf-'))
        variables:
          - name: ob_release_environment
            value: Production
        jobs:
          - job: pypi
            displayName: Release ccf
            pool:
              type: release
            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - input: pipelineArtifact
                  artifactName: drop_build_ccf
            steps:
              - task: CopyFiles@2
                displayName: Stage wheel for ESRP
                inputs:
                  sourceFolder: $(Pipeline.Workspace)
                  contents: "**/*.whl"
                  targetFolder: $(Pipeline.Workspace)/esrp_dist
                  flattenFolders: true
              - task: EsrpRelease@10
                displayName: ESRP release to PyPI
                inputs:
                  connectedservicename: $(ESRP_SERVICE_CONNECTION)
                  usemanagedidentity: false
                  keyvaultname: $(ESRP_KEY_VAULT_NAME)
                  signcertname: $(ESRP_SIGN_CERT_NAME)
                  authcertname: $(ESRP_AUTH_CERT_NAME)
                  clientid: $(ESRP_CLIENT_ID)
                  contenttype: pypi
                  intent: PackageDistribution
                  waitforreleasecompletion: true
                  folderlocation: $(Pipeline.Workspace)/esrp_dist
                  owners: $(ESRP_OWNERS)
                  approvers: $(ESRP_APPROVERS)
                  mainpublisher: $(ESRP_MAIN_PUBLISHER)
                  domaintenantid: $(ESRP_DOMAIN_TENANT_ID)

      - stage: attest
        displayName: Request Python package attestation
        dependsOn:
          - build
          - release
        condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/ccf-'))
        variables:
          - name: package_version
            value: $[ stageDependencies.build.ccf.outputs['package.package_version'] ]
          - name: wheel_sha256
            value: $[ stageDependencies.build.ccf.outputs['package.wheel_sha256'] ]
        jobs:
          - job: dispatch
            displayName: Trigger GitHub attestation workflow
            pool:
              type: linux
            variables:
              ob_outputDirectory: $(Build.SourcesDirectory)/out
            steps:
              - checkout: none
              - bash: |
                  set -euo pipefail
                  : "${GH_TOKEN:?GITHUB_ATTESTATION_TOKEN must be configured}"
                  mkdir -p "$OUTPUT_DIR"
                  python3 - <<'PY' > "$OUTPUT_DIR/attestation-dispatch.json"
                  import json
                  import os
                  import re
                  from urllib.parse import quote

                  inputs = {
                      "release_tag": os.environ["BUILD_SOURCEBRANCH"].removeprefix("refs/tags/"),
                      "package_version": os.environ["PACKAGE_VERSION"],
                      "wheel_sha256": os.environ["WHEEL_SHA256"],
                      "source_commit": os.environ["BUILD_SOURCEVERSION"],
                      "pipeline_run_url": (
                          f'{os.environ["SYSTEM_COLLECTIONURI"]}'
                          f'{quote(os.environ["SYSTEM_TEAMPROJECT"], safe="")}'
                          f'/_build/results?buildId={os.environ["BUILD_BUILDID"]}'
                      ),
                  }
                  if not all(inputs.values()):
                      raise ValueError("Missing Python package attestation inputs")
                  if not re.fullmatch(r"[0-9a-f]{64}", inputs["wheel_sha256"]):
                      raise ValueError("Invalid Python wheel SHA-256 digest")
                  if not re.fullmatch(r"[0-9a-f]{40}", inputs["source_commit"]):
                      raise ValueError("Invalid Python package source commit")
                  if inputs["release_tag"].removeprefix("ccf-").replace("-", ".", 1) != inputs["package_version"]:
                      raise ValueError("Release tag does not match the package version")
                  print(json.dumps({"ref": inputs["release_tag"], "inputs": inputs}))
                  PY
                  curl --fail-with-body --silent --show-error \
                    --connect-timeout 10 --max-time 60 \
                    --request POST \
                    --header "Authorization: Bearer $GH_TOKEN" \
                    --header "Accept: application/vnd.github+json" \
                    --header "X-GitHub-Api-Version: 2022-11-28" \
                    --header "Content-Type: application/json" \
                    --data-binary "@$OUTPUT_DIR/attestation-dispatch.json" \
                    https://api.github.com/repos/microsoft/CCF/actions/workflows/python-package-attestation.yml/dispatches
                displayName: Dispatch attestation for the published wheel
                env:
                  GH_TOKEN: $(GITHUB_ATTESTATION_TOKEN)
                  PACKAGE_VERSION: $(package_version)
                  WHEEL_SHA256: $(wheel_sha256)
                  OUTPUT_DIR: $(Build.SourcesDirectory)/out
